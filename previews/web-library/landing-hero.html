<style>
  .web-hero {
    --ink: #12141a;
    --mute: rgba(18, 20, 26, .62);
    --line: rgba(18, 20, 26, .1);
    --bg: #f4f6f8;
    --accent: #2457f5;
    min-height: 640px;
    display: flex; flex-direction: column;
    background:
      linear-gradient(135deg, rgba(36, 87, 245, .08), transparent 42%),
      radial-gradient(900px 480px at 88% 0%, rgba(36, 87, 245, .16), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", sans-serif;
  }
  .web-hero-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 40px; border-bottom: 1px solid transparent;
  }
  .web-hero-brand { font-weight: 760; letter-spacing: -.02em; font-size: 18px; }
  .web-hero-links { display: flex; gap: 18px; color: var(--mute); font-size: 14px; font-weight: 600; }
  .web-hero-main {
    flex: 1; display: grid; grid-template-columns: 1.05fr .95fr; gap: 36px;
    align-items: center; padding: 48px 40px 56px;
  }
  .web-hero-copy h1 {
    margin: 0 0 16px; font-size: 54px; line-height: 1.05; letter-spacing: -.035em; font-weight: 750;
    max-width: 11ch;
  }
  .web-hero-copy p {
    margin: 0 0 28px; max-width: 36ch; font-size: 18px; line-height: 1.5; color: var(--mute);
  }
  .web-hero-cta { display: flex; gap: 12px; align-items: center; }
  .web-hero-cta .primary,
  .web-hero-cta .ghost {
    appearance: none; border: 0; border-radius: 999px; cursor: pointer;
    font: inherit; font-weight: 700; padding: 12px 18px;
  }
  .web-hero-cta .primary { background: var(--accent); color: #fff; }
  .web-hero-cta .ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .web-hero-panel {
    border-radius: 28px; min-height: 360px; padding: 28px;
    background: #fff; box-shadow: 0 18px 50px rgba(18, 20, 26, .1);
    border: 1px solid rgba(255,255,255,.7);
  }
  .web-hero-panel h2 {
    margin: 0 0 8px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
  }
  .web-hero-panel strong {
    display: block; margin-bottom: 18px; font-size: 28px; letter-spacing: -.03em;
  }
  .web-hero-bars { display: grid; gap: 14px; }
  .web-hero-bar {
    display: grid; grid-template-columns: 72px 1fr 40px; gap: 12px; align-items: center;
    font-size: 13px; font-weight: 650; color: var(--mute);
  }
  .web-hero-bar i {
    display: block; height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #7aa0ff);
  }
</style>
<div class="web-hero">
  <header class="web-hero-nav">
    <div class="web-hero-brand">Brew Journal</div>
    <div class="web-hero-links">
      <span>Product</span>
      <span>Pricing</span>
      <span>Stories</span>
    </div>
  </header>
  <div class="web-hero-main">
    <div class="web-hero-copy">
      <h1>把每一杯冲得更稳</h1>
      <p>记录参数、回看风味、收到下一杯建议。给认真喝手冲的人一条更短的进步路径。</p>
      <div class="web-hero-cta">
        <button type="button" class="primary">开始免费试用</button>
        <button type="button" class="ghost">看示例记录</button>
      </div>
    </div>
    <aside class="web-hero-panel">
      <h2>This week</h2>
      <strong>甜感更清楚的 5 杯</strong>
      <div class="web-hero-bars">
        <div class="web-hero-bar"><span>水温</span><i style="width:82%"></i><span>92°</span></div>
        <div class="web-hero-bar"><span>粉水比</span><i style="width:70%"></i><span>1:16</span></div>
        <div class="web-hero-bar"><span>时长</span><i style="width:64%"></i><span>2′30</span></div>
        <div class="web-hero-bar"><span>风味</span><i style="width:88%"></i><span>8.7</span></div>
      </div>
    </aside>
  </div>
</div>
