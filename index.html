<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinpoint</title>
<link rel="stylesheet" href="/kits/ios/ios-kit.css">
<!-- workbench chrome 视觉 token（生成物：scripts/build-wb-tokens.mjs → src/workbench/wb-tokens.css） -->
<link rel="stylesheet" href="/src/workbench/wb-tokens.css">
<!-- Shared annotation-list rows (also inlined into /annotate.js for the client sidebar) -->
<link rel="stylesheet" href="/src/shared/ann-list.css">
<style>
  /* ── workbench shell (dev chrome — not iOS). Pages section lists workbench pages;
     Example Library loads from content/previews/library/board.json + sibling screen HTML.
     :root 的 --wb-* token 归 src/workbench/wb-tokens.css（生成物），此处不再定义。 */
  * { box-sizing:border-box; }
  /* Focus catch-all: low-specificity ring so every focusable control keeps a
     visible focus state. chrome 组件的 focus outline 统一走本规则 —— app/ui
     复制件已剥离 shadcn ring（outline:none 在 layer(utilities)，本规则未分层
     恒优先，V0 起的设计）。 */
  :where(button, a, input, select, textarea, [tabindex]):focus-visible {
    outline:2px solid color-mix(in srgb, var(--wb-accent) 55%, transparent);
    outline-offset:1px;
  }
  body {
    margin:0; height:100vh; overflow:hidden; background:var(--wb-bg); color:var(--wb-fg);
    font-family:var(--wb-font);
  }
  /* 外壳（2026-09-04 重设计，评审板 F2 + G1）：画布满铺整个视口，chrome 全是
     压在它上面的浮层 —— 左栏玻璃面板、底部横条、按需弹出的列表 / detail。
     .wb 只当定位容器，不再是 flex 三栏。 */
  .wb { position:relative; height:100vh; overflow:hidden; }

  /* 左栏 = 浮动玻璃面板（2026-09-04 重设计：F2 磨砂 + G1b 几何）。
     位置：四缘距视口 --wb-chrome-gap；下沿停在底部横条上方同一间距
     （bottom = gap × 2 + strip-h），横条整条永远在最上层，页名与帧导航不被压。
     材质：--wb-glass + --wb-glass-blur + 0.5px 上缘内高光 + sh-3，圆角
     --wb-r-glass —— 三处浮层（本面板 / 横条 / 弹出列表）共用 .wb-glass 一份配方。
     宽度仍吃 --wb-side-w（200–480 拖拽 + prefs 持久化，ADR 0016 左栏那一半保留）。 */
  .wb-glass {
    background:var(--wb-glass);
    -webkit-backdrop-filter:var(--wb-glass-blur);
    backdrop-filter:var(--wb-glass-blur);
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.6), var(--wb-sh-3);
  }
  .wb-side {
    position:absolute; z-index:6;
    left:var(--wb-chrome-gap); top:var(--wb-chrome-gap);
    bottom:calc(var(--wb-strip-h) + var(--wb-chrome-gap) * 2);
    width:var(--wb-side-w);
    display:flex; flex-direction:column; min-width:0; overflow:hidden;
    border-radius:var(--wb-r-glass);
    transition: width var(--wb-dur) var(--wb-ease), opacity var(--wb-dur) var(--wb-ease);
  }
  body.wb-resizing .wb-side { transition:none; }
  .wb.wb-side-collapsed .wb-side {
    width:0; opacity:0; pointer-events:none;
  }
  /* splitter（ADR 0016 宽度拖拽）随面板浮起：钉在面板右缘、与面板等高。
     常态不画线 —— 画布上不该有一条无来由的竖线；hover / 拖拽中才现出握把。
     折叠态贴左缘变成一条「点开」条（单击展开，拖动跟手）。 */
  .wb-splitter {
    position:absolute; z-index:7;
    left:calc(var(--wb-chrome-gap) + var(--wb-side-w) - 2px);
    top:var(--wb-chrome-gap);
    bottom:calc(var(--wb-strip-h) + var(--wb-chrome-gap) * 2);
    width:5px; cursor:col-resize; touch-action:none;
    background:transparent; border:0; padding:0;
  }
  .wb-splitter::after {
    content:''; position:absolute; top:12px; bottom:12px; left:50%; transform:translateX(-50%);
    width:3px; border-radius:999px; background:transparent;
    transition:background .12s var(--wb-ease);
  }
  .wb-splitter:hover::after, .wb-splitter.on::after {
    background:color-mix(in srgb,var(--wb-accent) 40%,transparent);
  }
  .wb.wb-side-collapsed #wbsplit {
    left:2px; width:12px; cursor:pointer;
  }
  .wb.wb-side-collapsed #wbsplit:hover::after { background:var(--wb-accent); }
  body.wb-resizing { cursor:col-resize; user-select:none; }
  body.wb-resizing iframe { pointer-events:none; }

  /* ── 左栏内容（2026-09-04 切片 ②，评审板 C1；结构在 app/Sidebar.jsx）──
     head → 搜索框 → 段（最近 / 页面 / 内容）→ 行。行的几何与皮肤集中在这里，
     不散进 Tailwind 类：一行同时要装类型槽、缩进、选中/hover/落点三态和
     行尾元数据，用 utility 拼会把「一行长什么样」拆成十几处。 */
  #wbside .wb-head {
    flex:none; display:flex; align-items:center; gap:6px;
    padding:11px 12px 7px;
  }
  .wb-wordmark {
    font:var(--wb-w-semibold) 13px/1 var(--wb-font); letter-spacing:-.01em;
    color:var(--wb-fg); user-select:none;
  }
  /* 连接状态只剩一颗点（原来那句「已连接」占掉了头部第一眼）：绿 = 通，
     红 = 断，整句话留在 title 里。 */
  .wb-conn { display:inline-flex; align-items:center; flex:none; }
  .wb-conn-dot {
    width:6px; height:6px; border-radius:50%; display:block;
    background:var(--wb-ok); box-shadow:0 0 0 2px color-mix(in srgb,var(--wb-ok) 20%,transparent);
  }
  .wb-conn[data-state="offline"] .wb-conn-dot {
    background:var(--wb-danger); box-shadow:0 0 0 2px color-mix(in srgb,var(--wb-danger) 18%,transparent);
  }
  .wb-head-sp { flex:1; }

  .wb-search {
    flex:none; display:flex; align-items:center; gap:6px;
    margin:0 10px 4px; padding:0 8px; height:28px;
    border-radius:var(--wb-r-3); background:var(--wb-fill);
  }
  .wb-search .wb-search-ic { width:13px; height:13px; flex:none; color:var(--wb-faint); }
  .wb-search input {
    flex:1; min-width:0; border:0; background:transparent; outline:none; padding:0;
    font:var(--wb-t-body) var(--wb-font); color:var(--wb-fg);
  }
  .wb-search input::placeholder { color:var(--wb-faint); }
  /* focus 环画在整格上，不画在格子里的输入框上 —— catch-all 落到 input 自己身上
     会在药丸里再套一个方框（框中框）。要压的是两条同款规则：本文件顶部那条
     `:where(…)`，以及 client 运行期注入的 `[data-ann-ui] :is(…)`（同为 0-2-1，
     源码序在后，所以这里必须靠 #wbside 升到 1-2-1 才盖得住）。 */
  #wbside .wb-search input:focus-visible { outline:none; }
  .wb-search:focus-within {
    outline:2px solid color-mix(in srgb, var(--wb-accent) 55%, transparent);
    outline-offset:1px;
  }
  .wb-search-kbd { flex:none; font:var(--wb-w-medium) 10.5px/1 var(--wb-font-mono); color:var(--wb-faint); }

  .wb-section-head {
    font:var(--wb-w-semibold) 11px/1 var(--wb-font-mono);
    letter-spacing:.08em; text-transform:uppercase; color:var(--wb-muted);
    padding:12px 8px 6px;
  }
  .wb-section[data-section="recent"] .wb-section-head { padding-top:6px; }
  .wb-section-head-row { display:flex; align-items:center; justify-content:space-between; padding-right:8px; }
  .wb-section-head-row .wb-page-sort { margin-top:6px; }
  .wb-side-nav { padding:0 6px 2px; display:block; }

  /* 行：一套语言给页面行 / 文件夹行 / 最近行 / 「新建文件夹」共用。 */
  .wb-row {
    display:flex; align-items:center; gap:7px; width:100%;
    height:27px; padding:0 8px; border:0; background:transparent;
    border-radius:var(--wb-r-2); text-align:left; cursor:pointer; position:relative;
    font:var(--wb-t-row) var(--wb-font); color:var(--wb-fg);
    transition:background-color var(--wb-dur) var(--wb-ease);
  }
  .wb-row:hover { background:var(--wb-hover); }
  .wb-row.on, .wb-row.on:hover { background:var(--wb-sel); font-weight:var(--wb-w-semibold); }
  .wb-row-glyph { width:14px; height:14px; flex:none; color:var(--wb-faint); }
  .wb-row-slot { width:14px; flex:none; }
  .wb-row-chv { width:12px; height:12px; flex:none; color:var(--wb-faint); }
  .wb-row-t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-row-m {
    flex:none; font:var(--wb-w-regular) 11px/1 var(--wb-font-mono);
    color:var(--wb-faint); font-variant-numeric:tabular-nums;
  }
  /* 夹内的页：缩进一档，类型槽仍在（标题跨夹内夹外对得齐）。 */
  .wb-row.ind { padding-left:32px; }
  /* 落点（C1）：入夹 = 整行一圈 accent 内描边；夹内重排 = 目标行上/下沿一条线。 */
  .wb-row.drop { box-shadow:inset 0 0 0 1px var(--wb-accent); }
  .wb-row[data-drop-hint]::after {
    content:''; position:absolute; left:8px; right:8px; height:2px;
    border-radius:2px; background:var(--wb-accent); pointer-events:none;
  }
  .wb-row[data-drop-hint="before"]::after { top:-1px; }
  .wb-row[data-drop-hint="after"]::after { bottom:-1px; }
  .wb-row.renaming { padding-right:2px; }
  .wb-new-folder { color:var(--wb-muted); }
  .wb-loose[data-drop-hint="into"] {
    border-radius:var(--wb-r-2);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wb-accent) 45%,transparent);
  }
  .wb-loose:empty { min-height:8px; }
  .wb-folder-error {
    margin:4px 8px 0; font:var(--wb-t-body) var(--wb-font); color:var(--wb-danger);
  }

  [contenteditable] { cursor:text; border-radius:var(--wb-r-1); transition:background var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease); }
  [contenteditable]:hover { background:color-mix(in srgb,var(--wb-accent) 6%,transparent); }
  [contenteditable]:focus { background:color-mix(in srgb,var(--wb-accent) 8%,transparent); box-shadow:0 0 0 2px color-mix(in srgb,var(--wb-accent) 28%,transparent); }

  .wb-side-body { flex:1; min-height:0; display:flex; flex-direction:column; }
  .wb-side-scroll[hidden], .wb-settings-view[hidden] { display:none; }
  .wb-settings-view { flex:1; min-height:0; overflow-y:auto; }

  /* frame 树延伸线（decisions 2026-08-15c 原大纲，2026-08-16f 阶段 7 收编进「内容」
     区的画布条目；结构即正式组件结构，禁用 magic-number 画法）：
     14px rail 槽位，section 字母与竖向导线同轴；每行一个 spine 绝对定位贯穿整行
     （含 padding，相邻行线段首尾相接）；段头自带字母下缘接续线；末行收 └ 角；
     选中染整行、线压染色之上（spine 是行的子元素，天然染在行面之上）。
     皮肤值全 token，几何与 prototypes/sidebar-variants/sidebar.html 的 .ol-* 一致。 */
  .wb-outline { padding:2px 0 6px; }
  .wb-outline .ol { --rail:14px; }
  .wb-outline .ol + .ol { margin-top:5px; }
  .wb-outline .ol-sec {
    position:relative; display:flex; align-items:center; gap:6px; width:100%;
    padding:2px 8px 4px 6px;
    border:0; border-radius:6px; background:transparent; cursor:pointer; text-align:left;
    font:inherit; font-size:10.5px; font-weight:var(--wb-w-semibold); color:var(--wb-fg);
  }
  .wb-outline .ol-sec:hover { background:var(--wb-hover); }
  .wb-outline .ol-sec.on { color:var(--wb-accent); }
  .wb-outline .ol-L {
    width:var(--rail); flex:none; text-align:center;
    font-family:var(--wb-font-mono); font-size:9.5px; font-weight:var(--wb-w-bold);
    line-height:1; letter-spacing:.09em; color:var(--wb-accent);
  }
  .wb-outline .ol-sec::after {
    content:''; position:absolute; left:calc(6px + var(--rail)/2 - .5px);
    top:calc(50% + 5px); bottom:0; width:1px;
    background:color-mix(in srgb, var(--wb-accent) 32%, transparent);
  }
  .wb-outline .ol-row {
    position:relative; display:flex; align-items:center; gap:7px; width:100%;
    border:0; background:transparent; cursor:pointer; text-align:left;
    font:inherit; font-size:12px; font-weight:var(--wb-w-medium); color:var(--wb-fg);
    padding:5px 8px 5px calc(6px + var(--rail) + 6px); border-radius:var(--wb-r-2);
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-outline .ol-row:hover {
    background:color-mix(in srgb, var(--wb-accent) 5%, var(--wb-surface)); color:var(--wb-accent);
  }
  .wb-outline .ol-row.on {
    background:color-mix(in srgb, var(--wb-accent) 10%, var(--wb-surface)); color:var(--wb-accent);
  }
  .wb-outline .ol-row .spine { position:absolute; left:6px; top:0; bottom:0; width:var(--rail); pointer-events:none; }
  .wb-outline .ol-row .spine::before {
    content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; margin-left:-.5px;
    background:color-mix(in srgb, var(--wb-accent) 32%, transparent);
  }
  .wb-outline .ol-row .spine::after {
    content:''; position:absolute; left:50%; top:50%; width:calc(var(--rail)/2 + 3px); height:1px; margin-top:-.5px;
    background:color-mix(in srgb, var(--wb-accent) 32%, transparent);
  }
  .wb-outline .ol-row:last-child .spine::before { bottom:50%; }
  .wb-outline .ol-row .no {
    flex:none; font-family:var(--wb-font-mono); font-size:9.5px; font-weight:var(--wb-w-bold);
    line-height:1; letter-spacing:.06em; color:var(--wb-accent);
  }
  .wb-outline .ol-row .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-outline .ol-n {
    flex:none; min-width:16px; height:16px; padding:0 4px; display:grid; place-items:center;
    font-family:var(--wb-font-mono); font-size:9.5px; font-weight:var(--wb-w-bold); line-height:1;
    border-radius:5px;
    background:color-mix(in srgb, var(--wb-accent) 12%, var(--wb-surface)); color:var(--wb-accent);
  }
  .wb-outline .ol-n.warn {
    background:color-mix(in srgb, var(--wb-danger) 10%, var(--wb-surface)); color:var(--wb-danger);
  }

  /* frame 树定位的 focus 环：机身闪一圈 accent（~1.1s），与标注卡 goToMark 的锚点
     ann-flash 分工 —— 卡闪锚点，树定位闪整机。 */
  @keyframes wbFrameFlash {
    0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--wb-accent) 0%, transparent); }
    18% { box-shadow:0 0 0 3px color-mix(in srgb, var(--wb-accent) 85%, transparent); }
    100% { box-shadow:0 0 0 3px color-mix(in srgb, var(--wb-accent) 0%, transparent); }
  }
  .wb-frame-flash { animation:wbFrameFlash 1.1s var(--wb-ease); }

  /* 折叠段（.wb-section*）与滚动区（.wb-side-scroll → app/ui/scroll-area.jsx）
     的视觉已收编进 app/Sidebar.jsx（V2）—— 旧规则删除。reduced-motion 名单
     改指侧栏整树（#wbside *）—— chrome 过渡全部即时化。V3 扩 HUD/dock/
     frame 菜单/导出入口/导出对话框（skin 收编后过渡全部走 token duration）。 */
  @media (prefers-reduced-motion: reduce) {
    .wb-side, #wbside, #wbside *, [contenteditable],
    #wbstrip, #wbstrip *, #wbdock, #wbdock *,
    #wbcanvas-dock, #wbcanvas-dock *,
    .wb-frame-menu-shell, .wb-frame-menu-shell *, .wb-export-dialog, .wb-export-dialog *,
    .wb-library .wb-screen-dim,
    .wb-library .wb-screen .ios-stage,
    .wb-library .wb-screen .wb-comp-stage,
    .wb-library .wb-screen .wb-doc-stage {
      transition:none !important;
    }
    .wb-frame-flash { animation:none !important; }
  }

  /* 标注弹出列表（2026-09-04 评审板 H2，取代常驻右栏）：点横条右端的计数钮
     开合，锚在横条右端正上方，宽 280、最高 60vh。行结构照 H2：序号钉 → 引用号
     10.5 mono → 正文一行截断，hover 出「定位」。共享行结构（item/body/cap/text）
     仍来自 src/shared/ann-list.css，本块只叠 workbench 的弹出列表皮肤 ——
     client 运行期会再内联一份 ann-list.css（源码序在本块之后），同权重会盖掉，
     所以选择器一律加 #wbann-pop 前缀升权（旧右栏踩过这条）。 */
  #wbann-pop #wbann-list .wb-ann-item {
    background:transparent; border:0; border-radius:var(--wb-r-3);
    margin:0; position:relative;
  }
  #wbann-pop #wbann-list .wb-ann-item:hover { background:var(--wb-hover); }
  #wbann-pop #wbann-list .wb-ann-item--on {
    background:var(--wb-sel);
  }
  #wbann-pop #wbann-list .wb-ann-item-main { padding:7px 8px; align-items:center; }
  #wbann-pop #wbann-list .wb-ann-num {
    width:18px; height:18px; min-width:18px; padding:0; margin-top:0;
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--wb-accent); color:#fff;
    font-family:var(--wb-font-mono); font-size:10px; font-weight:var(--wb-w-semibold);
  }
  #wbann-pop #wbann-list .wb-ann-cap {
    font-family:var(--wb-font-mono); font-size:10.5px; line-height:1.4; color:var(--wb-muted);
  }
  #wbann-pop #wbann-list .wb-ann-text {
    -webkit-line-clamp:1; font-size:12px; line-height:1.4; color:var(--wb-fg);
  }
  /* 锚点失效 = 序号钉转红 + 文本退灰（弹出列表没有卡片边框可染，08-14 的整卡红
     语义在这里落到钉与文本上） */
  #wbann-pop #wbann-list .wb-ann-item--broken .wb-ann-num {
    background:var(--wb-danger); color:#fff;
  }
  #wbann-pop #wbann-list .wb-ann-item--broken .wb-ann-text,
  #wbann-pop #wbann-list .wb-ann-item--broken .wb-ann-cap { color:var(--wb-faint); }
  /* 行尾「定位」= ghost 钮，hover / focus 才现出（H2） */
  #wbann-pop .wb-ann-go {
    flex:none; align-self:center; height:22px; padding:0 9px; margin-right:2px;
    border:0; border-radius:var(--wb-r-2); background:var(--wb-fill);
    font:var(--wb-w-medium) 11px/22px var(--wb-font); color:var(--wb-muted);
    cursor:pointer; visibility:hidden;
  }
  #wbann-pop .wb-ann-item:hover .wb-ann-go,
  #wbann-pop .wb-ann-item:focus-within .wb-ann-go { visibility:visible; }
  #wbann-pop .wb-ann-go:hover { background:var(--wb-hover); color:var(--wb-fg); }
  /* 左栏紧凑断点（2026-08-16b 立，2026-08-16f 阶段 7 改指条目 tag）：左栏宽 < 230
     时 boot-prefs applySideWidth 给 #wbside 打 compact —— 产物条目的类型 tag
     （.wb-entry-tag，基础形态在 app/Sidebar.jsx Tailwind 类）整枚隐藏，只留标题；
     拖回 ≥230 自动恢复。2026-08-17g：Page 行的相对时间（.wb-page-time）同规则。 */
  #wbside.compact .wb-entry-tag { display:none; }
  #wbside.compact .wb-page-time { display:none; }
  /* ScrollArea viewport 内层包装（Radix 内联 display:table;min-width:100%）按
     内容自然宽排版 —— Page 行不随栏宽收缩，行尾 copy 钮被 #wbside 的
     overflow-x:hidden 裁出栏外（2026-08-17 实况：自然宽 274 > 栏宽 250）。
     栏内语义是 truncate 不横滚，强制回 block；内联样式须 !important 压。 */
  #wbside [data-slot="scroll-area-viewport"] > div { display:block !important; }
  .wb-ico {
    width:14px; height:14px; flex:none; display:block; aspect-ratio:1;
  }
  /* footer chrome（.wb-foot/#wbtheme）的视觉已收编进 app/Sidebar.jsx（V2：
     #wbtheme 走共享 Seg，app/Seg.jsx）—— 旧规则删除。 .ctl 通用组的两个消费者
     （#wbtheme/.wb-ann-filter）本刀收编完毕，.ctl 规则一并删除。
     #wbgear 收编在 app/ui/button.jsx（tool variant，V0）；设置视图皮肤收编在
     app/SettingsView.jsx（V1）—— 各处旧规则均已删除。 */

  /* 画布背景三态（2026-08-15 V2 图纸人格，decisions 08-14/08-15）：钉在不滚动的 wrap 上
     （屏空间固定 —— pan/zoom 不带动、无 moiré），#wbstage 透明透出。
     grid = 24/120 双线网格（默认）；dots = 圆点纸（08-13 评审板 C 点阵收编为一档）；
     plain = 空白浅面。data-grid 由 boot-prefs setStageBg 写。 */
  .wb-stage-wrap {
    position:absolute; inset:0; display:flex; min-height:0;
    background-color:var(--wb-stage-bg);
  }
  .wb-stage-wrap[data-grid="grid"] {
    background-image:
      linear-gradient(var(--wb-grid-1) 1px, transparent 1px),
      linear-gradient(90deg, var(--wb-grid-1) 1px, transparent 1px),
      linear-gradient(var(--wb-grid-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--wb-grid-2) 1px, transparent 1px);
    background-size:120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  .wb-stage-wrap[data-grid="dots"] {
    background-image:radial-gradient(circle, var(--wb-stage-dot) 1.3px, transparent 1.8px);
    background-size:24px 24px;
  }
  .wb-stage-wrap[data-grid="plain"] {
    background-color:color-mix(in srgb, var(--wb-accent) 2%, #fff);
  }
  /* main stage — canvas has intrinsic size; #wbstage is only a scrollport */
  .wb-stage {
    flex:1; min-width:0; display:block; padding:0; background:transparent; overflow:auto;
    cursor:default;
  }
  .wb-stage.wb-space-pan { cursor:grab; }
  .wb-stage.wb-panning, body.wb-panning .wb-stage, body.wb-panning .wb-stage * { cursor:grabbing !important; }
  body.wb-panning { user-select:none; }

  /* 底部横条（2026-09-04 评审板 G1）：一条居中浮起的胶囊，从左到右读下来 =
     在哪一页（面板开关 + 页名 + 类型标）→ 在哪一帧（‹ 1/6 › + map）→ 画布怎么看
     （缩放 回中 导出）→ 在干什么（交互｜标注 + 计数）。四段用分隔线隔开。
     内部控件皮肤收编在 app/Strip.jsx / app/CanvasHud.jsx（Tailwind 类），
     这里只留容器几何与材质。--wb-strip-w 由 Strip.jsx 量测回写在 :root 上，
     dock 与弹出列表靠它对齐横条两端。 */
  .wb-strip {
    position:absolute; z-index:10;
    left:50%; transform:translateX(-50%);
    bottom:var(--wb-chrome-gap);
    height:var(--wb-strip-h); max-width:calc(100% - var(--wb-chrome-gap) * 2);
    display:flex; align-items:center; gap:7px; padding:0 8px;
    border-radius:999px;
    font-size:12px; color:var(--wb-fg);
  }
  .wb-strip > * { flex:none; white-space:nowrap; }
  .wb-strip-div { width:1px; height:17px; flex:none; background:var(--wb-seam); }
  /* 按需浮层的停靠槽（弹出的标注列表 / detail 面板）：横条右端正上方。
     容器本身不吃事件，只有里面的卡片吃。 */
  #wbdock {
    position:absolute; z-index:7; inset:0; pointer-events:none;
  }
  .wb-dock-card {
    position:absolute; pointer-events:auto;
    right:calc(50% - var(--wb-strip-w) / 2);
    bottom:calc(var(--wb-chrome-gap) + var(--wb-strip-h) + 8px);
    width:280px; max-height:60vh;
    display:flex; flex-direction:column; overflow:hidden;
    border-radius:var(--wb-r-glass);
  }
  /* 画布 dock（section-nav + minimap）：2026-09-04 起停靠画布右下角、横条正上方。
     开关钮虽然搬进了横条中段，面板本体仍留在角上——横条中段正上方是底部
     composer（#ann-box，居中 720 宽）的地盘，两者会压在一起。右下角同时避开
     右下浮层槽（#wbdock 贴横条右端，x 落在横条内），两块卡不打架。 */
  .wb-canvas-dock {
    --wb-canvas-nav-w:232px;
    position:absolute; z-index:8;
    right:var(--wb-chrome-gap);
    bottom:calc(var(--wb-chrome-gap) + var(--wb-strip-h) + 8px);
    max-height:calc(100% - var(--wb-strip-h) - 60px);
    display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    pointer-events:none;
  }
  .wb-canvas-dock > * { pointer-events:auto; }
  /* section-nav 列表行（.wb-section-nav-item 系）是 board-nav 命令式构建的
     不受管内容（#wbsection-nav-list innerHTML，不进 Tailwind 扫描源）——
     手写 CSS 保留、全 token 化（V3）：hover 浅面 --wb-hover；on 行 accent 8%
     面 + 左缘 3px 指示条；screen 点 = 白面发丝小钮，hover/focus accent 边 + 上浮。 */
  .wb-section-nav-item {
    position:relative; min-height:38px; padding:4px 7px 4px 9px; box-sizing:border-box;
    border-radius:var(--wb-r-3); display:grid; grid-template-columns:minmax(0, 1fr) auto; align-items:center; gap:8px;
    color:var(--wb-muted);
    transition:background var(--wb-dur) var(--wb-ease);
  }
  .wb-section-nav-item::before {
    content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:var(--wb-r-1);
    background:transparent;
  }
  .wb-section-nav-item:hover { background:var(--wb-hover); }
  .wb-section-nav-item.on,
  .wb-section-nav-item.on:hover { background:color-mix(in srgb,var(--wb-accent) 8%,var(--wb-surface)); }
  .wb-section-nav-item.on::before { background:var(--wb-accent); }
  .wb-section-nav-section {
    min-width:0; height:30px; padding:0; border:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; text-align:left;
    color:inherit; font:inherit; font-size:12px; font-weight:var(--wb-w-semibold);
  }
  .wb-section-nav-item.on .wb-section-nav-section { color:var(--wb-fg); }
  .wb-section-nav-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wb-section-nav-screens { display:flex; align-items:center; gap:4px; }
  .wb-section-nav-screen {
    width:14px; height:26px; padding:0; border:1px solid var(--wb-line);
    border-radius:var(--wb-r-1); background:var(--wb-surface); cursor:pointer;
    transition:border-color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease), transform var(--wb-dur) var(--wb-ease);
  }
  .wb-section-nav-screen:hover,
  .wb-section-nav-screen:focus-visible {
    border-color:var(--wb-accent); transform:translateY(-1px);
  }
  /* Huge empty margin around the board so the viewer can pan freely */
  .wb-panel {
    --wb-board-pad: 3200px;
    display:block; width:max-content; min-width:100%;
    box-sizing:border-box; overflow:visible;
    padding: var(--wb-board-pad);
  }
  /* Scale via transform (not CSS zoom): zoom breaks elementFromPoint vs getBoundingClientRect. */
  .wb-zoom-wrap {
    position: relative;
    overflow: hidden;
    width: max-content;
    height: auto;
  }
  .wb-library {
    /* Board tokens: captions scale with phone frame so agents only write copy. */
    --wb-phone-w: 438px;
    --wb-phone-h: 910px;
    /* 2026-09-04 外壳重设计（E1）：三档字对着 100% 缩放下的观感定，画布基准是
       scale 0.5，所以这里的值 = 观感值 × 2。区头 13/600 正色、屏名 12/500 淡、
       引用号 10.5 mono accent —— 三层各自一档，不再是同一个灰。 */
    --wb-cap-section: calc(var(--wb-phone-w) * 0.0594); /* ~26px @ 438 = 13px @ 100% */
    --wb-cap-screen: calc(var(--wb-phone-w) * 0.055);  /* ~24px @ 438 = 12px @ 100% */
    --wb-cap-note: calc(var(--wb-phone-w) * 0.032);    /* ~14px @ 438 */
    --wb-cap-gap: calc(var(--wb-phone-w) * 0.032);     /* ~14px */
    /* 图纸图注（2026-08-15 引用法）：mono 引用号（A1 / section 字母）与 frame 下方
       尺寸行共用一档，随机身宽度缩放 —— agent 只写文案，字号永远走这里。 */
    --wb-cap-ref: calc(var(--wb-phone-w) * 0.048);     /* ~21px @ 438 = 10.5px @ 100% */
    display:flex; flex-direction:column; gap:56px;
    padding:32px 24px 80px; box-sizing:border-box;
    width:max-content; min-width:0;
    align-items:flex-start;
    /* 2026-08-17 基准重定标（decisions 08-17c）：视觉 = zoom × 0.5（0.5 烘在
       基准），zoom 轴 1（HUD 100%）= 舒适默认；--wb-board-zoom 存 zoom 轴值，
       另一个消费点 = boot-prefs syncBoardZoomLayout。 */
    transform: scale(calc(var(--wb-board-zoom, 1) * 0.5));
    transform-origin: 0 0;
  }
  .wb-lib-item {
    width:max-content; max-width:none;
    display:flex; flex-direction:column; align-items:flex-start; gap:var(--wb-cap-gap);
    scroll-margin-top:24px; flex:none;
  }
  .wb-lib-cap {
    flex:none; width:var(--wb-phone-w); max-width:none; margin:0;
    font-size:var(--wb-cap-section); font-weight:var(--wb-w-semibold); line-height:1.2; letter-spacing:-.02em;
    color:var(--wb-fg);
  }
  .wb-sec-body {
    width:max-content; display:flex; align-items:flex-start; justify-content:flex-start;
    flex:none;
  }
  .wb-sec-column { flex-direction:column; align-items:flex-start; gap:24px; flex-wrap:nowrap; }
  /* Row: titles, phones, and dims each share a row（2026-08-17：Frame Note 收编
     右栏 detail 面板，画布网格从四行收为三行）。 */
  .wb-sec-row {
    display:grid;
    grid-auto-flow:column;
    grid-template-rows:auto auto auto;
    column-gap:28px;
    row-gap:var(--wb-cap-gap);
    align-items:start;
  }
  .wb-sec-row .wb-screen { display:contents; }
  /* Phone frame on the board = iPhone 16 Pro chrome (402+2×18), not a fluid fit box */
  .wb-screen {
    width:var(--wb-phone-w); max-width:none; flex:none;
    display:flex; flex-direction:column; gap:var(--wb-cap-gap);
  }
  .wb-lib-item .ios-stage {
    width:var(--wb-phone-w); height:var(--wb-phone-h);
    max-width:none; min-height:0; padding:0;
    flex:none;
  }
  .wb-screen .ios-stage { flex:none; min-height:0; width:var(--wb-phone-w); height:var(--wb-phone-h); }
  /* 图注（2026-08-15 图纸版式 → 2026-09-04 E1 层级）：引用号与屏名同一行
     （mono accent + 12/500 淡），「···」跟在屏名后面；尺寸在 frame 下方居中
     mono 小字，只在这一帧 hover / 选中时出。wb-screen-cap--empty 退役 ——
     引用号恒在，无题 frame 也保持可寻址。 */
  .wb-screen-cap {
    flex:none; width:var(--wb-phone-w); box-sizing:border-box;
    display:flex; align-items:baseline; gap:calc(var(--wb-cap-gap) * 0.5);
    text-align:left;
  }
  .wb-cap-ref {
    flex:none;
    font-family:var(--wb-font-mono); font-size:var(--wb-cap-ref); font-weight:var(--wb-w-bold);
    line-height:1.2; letter-spacing:.09em; color:var(--wb-accent);
  }
  .wb-cap-title {
    min-width:0;
    font-size:var(--wb-cap-screen); font-weight:var(--wb-w-medium); line-height:1.3; letter-spacing:-.015em;
    color:var(--wb-muted);
  }
  .wb-cap-title:empty { display:none; }
  /* 2026-08-17 caption 截断兜底：title 规矩（单行短词）靠文档+契约拦新增，
     存量/超长由两行 clamp 兜住，全文经 title 属性悬停可读。 */
  .wb-cap-title, .wb-lib-cap {
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden;
  }
  /* section 大标题是 -webkit-box（两行 clamp），装不下 flex —— 引用号改行内元素
     就够了：A 和区名同一行，clamp 照旧管住整块。 */
  .wb-lib-cap .wb-cap-ref--section {
    display:inline; margin-right:calc(var(--wb-cap-gap) * 0.5);
  }
  .wb-screen-dim {
    flex:none; width:var(--wb-phone-w); box-sizing:border-box;
    text-align:center;
    font-family:var(--wb-font-mono); font-size:var(--wb-cap-ref); font-weight:var(--wb-w-medium);
    line-height:1.2; letter-spacing:.04em; color:var(--wb-faint);
  }
  /* 尺寸行只在这一帧 hover 或选中时出（2026-09-04 E1：「尺寸行常驻太吵」）。
     用 opacity 不用 display —— 行高留着，出没不推版面；范围限定 .wb-library，
     导出快照与 /api/frame 页共用同一份内联样式，那两处没有画布 hover 语境，
     尺寸行照常显示。 */
  .wb-library .wb-screen-dim {
    opacity:0;
    transition:opacity var(--wb-dur) var(--wb-ease);
  }
  .wb-library .wb-screen:hover > .wb-screen-dim,
  .wb-library .wb-screen.wb-sel > .wb-screen-dim,
  .wb-library .wb-screen:focus-within > .wb-screen-dim { opacity:1; }
  /* 2026-08-17 选中模型（detail 面板）：frame 选中 = 机身 accent 环；
     section 选中 = 大标题转 accent。与 wb-frame-flash（定位反馈，1.1s 动画）
     分工 —— .wb-sel 是持久选中态，由 board-nav syncBoardSelection 同步。 */
  .wb-screen.wb-sel .ios-stage,
  .wb-screen.wb-sel .wb-comp-stage,
  .wb-screen.wb-sel .wb-doc-stage {
    box-shadow:0 0 0 2px var(--wb-accent), 0 0 0 6px color-mix(in srgb, var(--wb-accent) 14%, transparent);
  }
  /* hover 环（2026-09-04 切片 ③ 第 15 条核查的结论）：选中本来就有环，hover 什么
     都没有 —— 鼠标在哪一帧上全靠猜。补一档 2px accent 30% 的淡环，选中态压过它。
     用 outline 不用 box-shadow：doc / 组件机身自带 --wb-sh-board，box-shadow 会
     把那层板影一起顶掉（选中态那条规则就是这么做的，本条不再扩大这个代价）。
     常态是 2px 透明环、只淡入淡出 outline-color —— 直接在 :hover 上写整条 outline
     会让过渡从 currentColor（正文色）起步，扫过时先闪一下深灰。
     和标注的琥珀框天然分色：环是 accent、在机身外缘；标注目标框是琥珀、在元素上。 */
  .wb-library .wb-screen .ios-stage,
  .wb-library .wb-screen .wb-comp-stage,
  .wb-library .wb-screen .wb-doc-stage {
    outline:2px solid transparent; outline-offset:0;
    transition:outline-color var(--wb-dur) var(--wb-ease);
  }
  .wb-library .wb-screen:hover .ios-stage,
  .wb-library .wb-screen:hover .wb-comp-stage,
  .wb-library .wb-screen:hover .wb-doc-stage {
    outline-color:color-mix(in srgb, var(--wb-accent) 30%, transparent);
  }
  .wb-library .wb-screen.wb-sel:hover .ios-stage,
  .wb-library .wb-screen.wb-sel:hover .wb-comp-stage,
  .wb-library .wb-screen.wb-sel:hover .wb-doc-stage { outline-color:transparent; }
  .wb-lib-item.wb-sel > .wb-lib-cap { color:var(--wb-accent); }
  /* Detail 面板（右栏上段，app/DetailPanel.jsx）：note 视图/编辑器皮肤。
     行内按钮与状态行沿用被收编的画布 Frame Note 视觉语言。 */
  .wb-detail-note-text {
    flex:1; min-width:0;
    color:var(--wb-fg); opacity:.68;
    font-size:var(--wb-cap-note); line-height:1.55;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .wb-detail-note-placeholder { color:var(--wb-faint); opacity:1; }
  .wb-note-action {
    appearance:none; flex:none;
    border:0; border-radius:var(--wb-r-3);
    padding:5px 8px;
    background:transparent; color:var(--wb-faint);
    font:inherit; font-size:11px; font-weight:var(--wb-w-semibold); line-height:1.2;
    cursor:pointer;
  }
  .wb-note-action:hover { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-note-action--save { background:var(--wb-accent); color:#fff; }
  .wb-note-action:disabled { cursor:default; opacity:.45; }
  .wb-note-input {
    width:100%; min-height:120px; resize:vertical; box-sizing:border-box;
    border:1px solid var(--wb-line); border-radius:var(--wb-r-4);
    padding:10px 11px;
    background:var(--wb-side); color:var(--wb-fg);
    font:inherit; font-size:var(--wb-cap-note); line-height:1.55;
    outline:none;
  }
  .wb-note-input:focus { border-color:var(--wb-accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--wb-accent) 14%, transparent); }
  .wb-note-status { flex:1; min-width:0; color:var(--wb-faint); font-size:10.5px; }
  .wb-note-status.is-error { color:var(--wb-danger); }
  /* Component Library: light board, no phone chrome */
  .wb-screen--comp {
    --wb-phone-w: auto;
    --wb-phone-h: auto;
    width:max-content; min-width:280px; max-width:420px;
  }
  .wb-comp-stage {
    width:max-content; min-width:280px; max-width:420px;
    box-sizing:border-box;
    padding:20px 18px 24px;
    border-radius:var(--wb-r-board);
    background:#fff;
    box-shadow:var(--wb-sh-board);
  }
  /* HTML board: standalone-document artboard. Wide enough that report pages
     that switch layout at a desktop breakpoint (side nav, two-column) show the
     desktop form; tall so long documents read without an inner scrollbar. */
  .wb-screen--doc {
    --wb-phone-w: var(--wb-doc-w, 1280px);
    --wb-phone-h: auto;
    width:var(--wb-doc-w, 1280px);
  }
  .wb-doc-stage {
    width:var(--wb-doc-w, 1280px);
    box-sizing:border-box;
    border-radius:var(--wb-r-board);
    background:#fff;
    box-shadow:var(--wb-sh-board);
    overflow:hidden;
  }
  .wb-doc-surface { position:relative; width:100%; background:#fff; }
  .wb-doc-frame { display:block; width:100%; height:100%; border:0; background:#fff; }

  /* 文档条目形态（data-page-mode="html"，2026-08-16f 阶段 6 起由选中条目派生，
     不再是页级属性）：a document is NOT a canvas. A report has to be read at the
     reader's real window size, so the document fills the stage 1:1 — no zoom, no
     pan, no artboard. Entries switch from the sidebar instead of sitting side by
     side. The chain stage → panel → zoom-wrap → library → item → sec-body →
     screen → doc-stage must each carry a definite height, or the iframe's
     height:100% resolves against auto and collapses. */
  /* 文档满铺，chrome 照样浮在它上面（owner 2026-09-05 裁决）：文档形态的 stage
     不为左栏和横条让位。09-04 的版本把 stage 收成让开左栏与横条的一栏，结果是
     面板旁边和横条底下露出一截画布纸 —— owner 的话是「下工具栏和侧栏都会导致
     画布露出来而不是直接在 html 上展示，这不直觉，html 不需要画布承载；我预期
     这个侧栏是 float 在画布上的，而不是挤压 html 的位置」。所以规则只有一条：
     文档 1:1 铺满整个视口，玻璃面板与横条压在文档上，和画布页一模一样；文档
     底下不许露出画布。被面板压住的正文靠收起面板来看（横条最左那颗钮）。
     board-nav 的 chromeInsets 只服务画布形态的定位 / 回中，这里不参与。 */
  [data-page-mode="html"] .wb-stage { overflow:hidden; padding:0; margin:0; }
  /* 文档形态没有画布可缩放：横条中段（帧导航 + 缩放 + 回中 + 导出）与 dock
     一起收起，横条本体留着 —— 页名、类型标、模式两段与计数在阅读器里照样要用。 */
  [data-page-mode="html"] #wbcanvas-tools,
  [data-page-mode="html"] #wbcanvas-tools-div,
  [data-page-mode="html"] .wb-canvas-dock { display:none; }
  [data-page-mode="html"] #wb-board-panel { width:100%; height:100%; padding:0; }
  [data-page-mode="html"] .wb-zoom-wrap {
    width:100%; height:100%; transform:none !important;
  }
  [data-page-mode="html"] .wb-library {
    display:block; width:100%; height:100%; padding:0; gap:0; transform:none !important;
  }
  [data-page-mode="html"] .wb-lib-item {
    display:flex; flex-direction:column; width:100%; height:100%; margin:0; padding:0; gap:0;
    border:0; background:transparent; box-shadow:none;
  }
  /* section 标题、frame 标题都属于画布语汇，整页阅读时不要。
     汇报页出图走侧栏「导出文档」（真实版面长图 / HTML）。 */
  [data-page-mode="html"] .wb-lib-cap,
  [data-page-mode="html"] .wb-screen-cap { display:none; }
  [data-page-mode="html"] .wb-sec-body {
    display:flex; flex:1; min-height:0; width:100%; padding:0; gap:0;
  }
  [data-page-mode="html"] .wb-screen--doc {
    flex:1; min-width:0; min-height:0; width:100%; height:auto; margin:0;
  }
  [data-page-mode="html"] .wb-doc-stage {
    width:100%; height:100%; border-radius:0; box-shadow:none;
  }
  [data-page-mode="html"] .wb-doc-surface { height:100%; }
  /* 条目显隐（2026-08-16f 阶段 6，pages.js applyEntryVisibility 唯一驱动）：非选中
     条目的屏与空 section 容器一律收起 —— 全局规则（不再 scope 到 html 形态）：
     混合板里画布条目态也要藏住 doc 屏。one entry at a time; the sidebar picks which. */
  .wb-lib-item[data-doc-hidden],
  .wb-screen[data-doc-hidden] { display:none; }

  /* 「内容」区（#wbcontents、.wb-entry* 系、条目行导出钮）与旧 version switcher
     的视觉都收编在 app/Sidebar.jsx（V2/阶段 7）—— 旧 #wbdoc-versions/.wb-doc-ver
     规则删除；frame 树（.wb-outline/.ol-*）几何保留在上方大纲块。 */
  .wb-export-options.wb-export-options--stack {
    grid-auto-flow:row; grid-auto-columns:unset; grid-template-columns:1fr;
  }
  .wb-export-options.wb-export-options--stack .wb-export-option span {
    justify-content:flex-start; min-height:40px; padding:8px 12px; gap:8px;
  }
  .wb-export-option-copy { display:flex; flex-direction:column; gap:1px; text-align:left; }
  .wb-export-option-copy strong { font-size:12.5px; font-weight:var(--wb-w-semibold); color:inherit; }
  .wb-export-option-copy small { font-size:11px; font-weight:var(--wb-w-medium); color:var(--wb-faint); }
  .wb-comp-stage .ios-root {
    display:block; width:100%; min-width:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  }
  .wb-comp-stage .ios-app {
    position:relative; inset:auto; overflow:visible;
    background:transparent; min-height:0;
  }
  .wb-comp-stage .ios-page { padding-bottom:8px; }
  .wb-comp-stage .ios-nav,
  .wb-comp-stage .ios-navbar { position:relative; }
  /* 失败面板（2026-09-04）：三行说明（标题 / 出处 / 原因）+ 两个动作。
     出处与原因走 mono（机器精度信息：url、id、状态码），动作是 ghost 钮
     —— 面板不是主行动面，不给实心。.wb-asset-err 是同一族的窄版：
     frame 内资源没进来时的行内提示（/sites/ 404 不再静默）。 */
  /* 板整体失败时面板是 #wb-board-panel 的唯一孩子 —— 那层有 3200px 画布留白，
     面板会落在视口外三千像素处（DOM 在、肉眼不在）。这种时候画布留白没有意义：
     去掉它，把面板摆在舞台中间。
     「舞台中间」在 2026-09-04 之后是**可用区**中间：左栏与横条压在满铺画布上，
     所以留一条它们宽的 padding，面板才落在人看得见的那块正中。 */
  #wb-board-panel:has(> .wb-screen-err) {
    min-height:100%;
    padding:0 0 calc(var(--wb-chrome-gap) * 2 + var(--wb-strip-h))
              calc(var(--wb-chrome-gap) * 2 + var(--wb-side-w));
    display:flex; align-items:center; justify-content:center;
  }
  .wb.wb-side-collapsed #wb-board-panel:has(> .wb-screen-err) { padding-left:0; }
  /* 2026-09-04 外壳重设计：虚线框退役 —— 失败面板是一块实底浮层（--wb-surface
     + sh-3 + radius 14），不是一块占位虚线。标题 14/600。 */
  .wb-screen-err,
  .wb-asset-err {
    margin:24px auto; padding:16px 18px; max-width:420px; text-align:center;
    font-size:12px; line-height:1.45; color:var(--wb-muted);
    border:0; border-radius:var(--wb-r-glass);
    background:var(--wb-surface); box-shadow:var(--wb-sh-3);
  }
  .wb-screen-err p, .wb-asset-err p { margin:0; }
  .wb-screen-err-title, .wb-asset-err-title {
    font-size:14px; font-weight:var(--wb-w-semibold); line-height:1.3; color:var(--wb-fg);
  }
  .wb-screen-err-src, .wb-screen-err-why, .wb-asset-err-src {
    margin-top:4px !important;
    font-family:var(--wb-font-mono); font-size:11px; color:var(--wb-faint);
    overflow-wrap:anywhere;
  }
  .wb-screen-err-acts {
    display:flex; justify-content:center; gap:8px; margin-top:12px;
  }
  .wb-screen-err-act {
    appearance:none; cursor:pointer;
    padding:5px 12px; font-family:var(--wb-font); font-size:11.5px;
    font-weight:var(--wb-w-medium); line-height:1.2; color:var(--wb-fg);
    background:transparent; border:1px solid var(--wb-line);
    border-radius:var(--wb-r-2);
    transition:background-color 120ms, border-color 120ms, color 120ms;
  }
  .wb-screen-err-act:hover { background:var(--wb-hover); }
  .wb-screen-err-act:focus-visible {
    outline:2px solid color-mix(in srgb, var(--wb-accent) 60%, transparent);
    outline-offset:1px;
  }
  .wb-screen-err-act:active { background:var(--wb-fill); }
  .wb-asset-err { margin:8px auto 0; max-width:100%; }
  /* Export is a Workbench concern: controls never enter the isolated export surface. */
  .wb-lib-item { position:relative; }
  /* 「···」贴着标签文字（2026-09-04 E1：不再钉在整行最右边、离得老远）：
     shell 是 caption 这条 flex 的最后一个 item，跟在屏名后面。常态不出，
     这一帧 hover / 键盘焦点进到 caption / 菜单开着时才现 —— 用 opacity 留位，
     出没不推版面，按钮始终在 tab 序里（visibility/display 会把它踢出去）。
     shell 保持 position:static —— 菜单面板的绝对定位因此落在 caption 上（左对齐、
     宽度进得去），而不是跟着这颗按钮在行里滑来滑去。 */
  .wb-screen-cap.has-frame-menu { position:relative; z-index:30; min-height:30px; }
  .wb-frame-menu-shell {
    flex:none; align-self:center;
    width:30px; height:30px;
    opacity:0; transition:opacity var(--wb-dur) var(--wb-ease);
  }
  .wb-screen:hover > .wb-screen-cap > .wb-frame-menu-shell,
  .wb-screen-cap:focus-within > .wb-frame-menu-shell,
  .wb-screen-cap:has(.wb-frame-menu-trigger[data-state="open"]) > .wb-frame-menu-shell { opacity:1; }
  /* frame ⋯ 菜单的 trigger/面板/项皮肤已收编进 app/frame-menu.jsx（V3，
     Tailwind 类）—— 此处只留 shell 几何与 popper 置惰规则。 */
  /* Radix DropdownMenu 的 popper 包装层置惰（P3）：菜单几何由 .wb-frame-menu 的
     绝对定位拥有 —— .wb-library 是 transform:scale 空间，JS 量测定位在缩放 ≠1
     时必错位；!important 压过 Radix 写在内联 style 里的 position/transform。
     2026-08-17 收敛到 :has(> .wb-frame-menu)：这条规则曾经是全局的，会把同样
     走 popper 定位的右键菜单（app/row-menu.jsx）/ Tooltip 一并压成 static ——
     菜单渲染在 body 末尾、视口之外，DOM 断言全绿但肉眼不可见（实测踩过）。
     置惰只服务画布缩放空间里的 frame 菜单，别放回全局。 */
  [data-radix-popper-content-wrapper]:has(> .wb-frame-menu) { position:static !important; transform:none !important; min-width:0 !important; }
  /* export dialog（导出图片/导出文档两型共用 .wb-export-*）：原生 dialog，标记在
     export-core.js 的 HTML 字符串里（不进 Tailwind 扫描源）—— 手写 CSS 全 token
     化（V3）：模态档 --wb-r-dialog + --wb-sh-4 + --wb-side 面（popover 语义）；
     2026-08-11 扁平化去掉发丝边。选项组收编槽式分段语言（--wb-fill 槽 + r-2 容器
     2px 内衬，选中项白面 + --wb-sh-1，SEG 同族）；按钮收编 28px 档（原 38px）；
     字栈统一 --wb-font。 */
  .wb-export-dialog {
    width:min(440px,calc(100vw - 32px)); padding:0; overflow:hidden;
    border:0; border-radius:var(--wb-r-dialog);
    background:var(--wb-side); color:var(--wb-fg);
    box-shadow:var(--wb-sh-4);
    font-family:var(--wb-font);
  }
  .wb-export-dialog::backdrop { background:rgba(22,22,24,.3); backdrop-filter:blur(3px); }
  .wb-export-form { padding:20px; display:flex; flex-direction:column; gap:17px; }
  .wb-export-head { display:flex; align-items:flex-start; gap:12px; }
  .wb-export-head-copy { flex:1; min-width:0; }
  .wb-export-head h2 { margin:0; font-size:18px; line-height:1.25; letter-spacing:-.015em; }
  .wb-export-target { margin:5px 0 0; color:var(--wb-faint); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-export-close {
    border:0; background:transparent; color:var(--wb-faint); cursor:pointer; flex:none;
    width:28px; height:28px; padding:0; border-radius:var(--wb-r-2);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-export-close:hover { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-export-back {
    border:0; background:transparent; color:var(--wb-muted); cursor:pointer; flex:none;
    width:28px; height:28px; padding:0; border-radius:var(--wb-r-2);
    display:inline-flex; align-items:center; justify-content:center; font:inherit; font-size:22px;
  }
  .wb-export-back:hover { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-export-kinds { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .wb-export-kinds button {
    min-height:112px; padding:16px; border:1px solid var(--wb-line); border-radius:var(--wb-r-4);
    background:var(--wb-surface); color:var(--wb-fg); text-align:left; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center; gap:7px; font:inherit;
  }
  .wb-export-kinds button:hover { background:var(--wb-hover); border-color:color-mix(in srgb, var(--wb-accent) 45%, var(--wb-line)); }
  .wb-export-kinds strong { font-size:14px; }
  .wb-export-kinds span { color:var(--wb-muted); font-size:12px; line-height:1.45; }
  .wb-offline-summary {
    padding:14px; border:1px solid var(--wb-line); border-radius:var(--wb-r-4);
    background:var(--wb-surface); display:flex; flex-direction:column; gap:6px;
  }
  .wb-offline-summary strong { font-size:13px; }
  .wb-offline-summary span { color:var(--wb-muted); font-size:12px; line-height:1.45; }
  .wb-offline-resources { max-height:260px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .wb-offline-resource {
    display:flex; align-items:flex-start; gap:9px; padding:10px;
    border:1px solid var(--wb-line); border-radius:var(--wb-r-2); background:var(--wb-surface);
  }
  .wb-offline-resource input { margin-top:2px; accent-color:var(--wb-accent); }
  .wb-offline-resource-copy { min-width:0; display:flex; flex:1; flex-direction:column; gap:3px; }
  .wb-offline-resource-copy strong { font-size:11.5px; }
  .wb-offline-resource-copy span, .wb-offline-resource-copy code {
    color:var(--wb-faint); font:10px/1.35 var(--wb-font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .wb-export-field { display:flex; flex-direction:column; gap:7px; }
  .wb-export-label { color:var(--wb-muted); font-size:12px; font-weight:var(--wb-w-semibold); }
  .wb-export-check {
    display:flex; align-items:flex-start; gap:8px; padding:8px 10px;
    border-radius:var(--wb-r-2); background:var(--wb-fill); cursor:pointer;
    font-size:12.5px; font-weight:var(--wb-w-medium); color:var(--wb-fg);
  }
  .wb-export-check input { margin-top:2px; flex:none; accent-color:var(--wb-accent); }
  .wb-export-check span { line-height:1.4; }
  .wb-export-options { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; padding:2px; border-radius:var(--wb-r-2); background:var(--wb-fill); }
  .wb-export-option { position:relative; }
  .wb-export-option input { position:absolute; opacity:0; pointer-events:none; }
  .wb-export-option span {
    display:flex; align-items:center; justify-content:center; min-height:24px; padding:0 9px;
    border-radius:var(--wb-r-1); color:var(--wb-muted); font-size:12px; font-weight:var(--wb-w-semibold); cursor:pointer;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .wb-export-option:hover span { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-export-option input:checked+span { background:var(--wb-surface); color:var(--wb-fg); box-shadow:var(--wb-sh-1); }
  .wb-export-note-toggle { display:flex; align-items:flex-start; gap:9px; color:var(--wb-muted); font-size:13px; line-height:1.4; }
  .wb-export-note-toggle input { margin-top:2px; accent-color:var(--wb-accent); }
  .wb-export-status { min-height:17px; color:var(--wb-faint); font-size:12px; }
  .wb-export-status.is-error { color:var(--wb-danger); }
  .wb-export-tokens {
    display:flex; flex-wrap:wrap; gap:8px; margin-top:-4px;
  }
  .wb-export-tokens[hidden] { display:none; }
  .wb-export-token {
    display:inline-flex; align-items:baseline; gap:5px;
    min-height:26px; padding:3px 9px; border-radius:999px;
    border:1px solid var(--wb-line); background:var(--wb-hover);
    color:var(--wb-muted); font-size:11.5px; font-weight:var(--wb-w-semibold);
  }
  .wb-export-token-label { color:var(--wb-faint); font-weight:var(--wb-w-semibold); }
  .wb-export-token-n { color:var(--wb-fg); font-variant-numeric:tabular-nums; font-weight:var(--wb-w-bold); }
  .wb-export-token-pending { color:var(--wb-faint); font-size:12px; }
  .wb-export-actions { display:flex; justify-content:flex-end; gap:8px; }
  .wb-export-action {
    min-height:28px; padding:0 12px; border:1px solid var(--wb-line); border-radius:var(--wb-r-2);
    background:var(--wb-surface); color:var(--wb-fg); font:inherit; font-size:13px; font-weight:var(--wb-w-semibold); cursor:pointer;
    transition:background var(--wb-dur) var(--wb-ease), border-color var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-export-action:hover { background:var(--wb-hover); }
  .wb-export-action.primary { border-color:var(--wb-accent); background:var(--wb-accent); color:var(--wb-surface); }
  .wb-export-action.primary:hover { background:color-mix(in srgb, var(--wb-accent) 90%, var(--wb-surface)); }
  .wb-export-action:disabled { cursor:wait; opacity:.55; }

  /* 导出 picker（decisions 2026-08-15d，mock = prototypes/sidebar-variants 的 .pk-*）：
     两栏（左 proto tree / 右 预览 + 背景三档），PNG 2× 固定。组件是
     app/ExportPicker.jsx（Tailwind 扫描源内），但这套格子纹理 / 棋盘格 / 自定义
     checkbox 是 token 化手写皮肤 —— 与 .wb-export-* 同区同居。 */
  .wb-export-picker { width:648px; max-width:calc(100vw - 48px); }
  .wb-export-picker .wb-export-form { padding:14px 16px 12px; gap:12px; }
  .wb-pk-body { display:flex; gap:14px; }
  .wb-pk-tree {
    width:228px; flex:none; display:flex; flex-direction:column; gap:1px;
    max-height:min(56vh, 420px); overflow-y:auto;
  }
  .wb-pk-sec, .wb-pk-fr {
    display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box;
    padding:5px 6px; border:0; border-radius:var(--wb-r-2); background:transparent;
    color:var(--wb-fg); font:inherit; font-size:12px; text-align:left; cursor:pointer;
  }
  .wb-pk-sec { font-weight:var(--wb-w-semibold); }
  .wb-pk-fr { padding-left:26px; font-weight:var(--wb-w-medium); }
  .wb-pk-sec:hover, .wb-pk-fr:hover { background:var(--wb-hover); }
  .wb-pk-box {
    width:14px; height:14px; border-radius:var(--wb-r-1); flex:none;
    display:grid; place-items:center;
    border:1px solid color-mix(in srgb, var(--wb-accent) 38%, transparent);
    background:var(--wb-surface); color:transparent;
    font-family:var(--wb-font-mono); font-size:9px; font-weight:var(--wb-w-bold); line-height:1;
  }
  .wb-pk-sec.on .wb-pk-box, .wb-pk-fr.on .wb-pk-box {
    background:var(--wb-accent); border-color:var(--wb-accent); color:var(--wb-surface);
  }
  .wb-pk-letter {
    width:18px; height:18px; border-radius:var(--wb-r-1); flex:none; text-align:center;
    border:1px solid color-mix(in srgb, var(--wb-accent) 42%, transparent); color:var(--wb-accent);
    font-family:var(--wb-font-mono); font-size:9.5px; font-weight:var(--wb-w-bold); line-height:18px;
  }
  .wb-pk-no {
    min-width:20px; flex:none; color:var(--wb-accent);
    font-family:var(--wb-font-mono); font-size:9px; font-weight:var(--wb-w-bold);
    line-height:1; letter-spacing:.06em;
  }
  .wb-pk-name { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-pk-dim {
    margin-left:auto; flex:none; color:var(--wb-faint);
    font-family:var(--wb-font-mono); font-size:9px; font-weight:var(--wb-w-medium); line-height:1;
  }
  .wb-pk-side { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  /* 预览面三态纹理与画布背景三态同源：画布 = 暖纸双线网格，透明 = 棋盘格 */
  .wb-pk-pv {
    height:292px; border-radius:var(--wb-r-4); box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding:12px; overflow:auto;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--wb-accent) 14%, transparent);
  }
  .wb-pk-pv[data-multi="true"] { flex-direction:row; align-items:flex-start; justify-content:flex-start; gap:16px; }
  .wb-pk-pv[data-bg="canvas"] {
    background:#faf8f4;
    background-image:
      linear-gradient(color-mix(in srgb, var(--wb-accent) 13%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--wb-accent) 13%, transparent) 1px, transparent 1px),
      linear-gradient(color-mix(in srgb, var(--wb-accent) 6%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--wb-accent) 6%, transparent) 1px, transparent 1px);
    background-size:120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  .wb-pk-pv[data-bg="white"] { background:#fff; }
  .wb-pk-pv[data-bg="transparent"] {
    background:repeating-conic-gradient(#ececee 0 25%, #fff 0 50%); background-size:14px 14px;
  }
  .wb-pk-pv.is-loading .wb-pk-pv-item { opacity:.55; }
  .wb-pk-pv-item { flex:none; display:flex; }
  .wb-pk-pv-item img { display:block; width:auto; height:auto; max-width:100%; max-height:268px; object-fit:contain; }
  .wb-pk-pv-empty { margin:0; font-size:10.5px; color:var(--wb-faint); }
  .wb-pk-opt { display:flex; align-items:center; gap:8px; font-size:11px; }
  .wb-pk-k { width:40px; flex:none; font-weight:var(--wb-w-semibold); color:var(--wb-fg); }
  .wb-pk-opt .wb-export-options { flex:1; }
  .wb-pk-ft { display:flex; align-items:center; gap:8px; }
  .wb-pk-st { flex:1; min-width:0; font-size:10.5px; color:var(--wb-faint); }
  .wb-pk-st.is-error { color:var(--wb-danger); }
</style>
</head>
<body>

<div class="wb" id="wbroot">
  <div class="wb-stage-wrap" data-grid="grid">
    <main class="wb-stage" id="wbstage"></main>
    <!-- React 挂载点：dock（section-nav + minimap）由 app/CanvasHud.jsx 渲染 -->
    <div class="wb-canvas-dock" id="wbcanvas-dock" data-ann-ui></div>
