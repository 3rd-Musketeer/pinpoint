<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinpoint</title>
<link rel="stylesheet" href="kits/ios/ios-kit.css">
<!-- workbench chrome 视觉 token（生成物：scripts/build-wb-tokens.mjs → workbench/wb-tokens.css） -->
<link rel="stylesheet" href="workbench/wb-tokens.css">
<!-- Shared annotation-list rows (also inlined into /annotate.js for the client sidebar) -->
<link rel="stylesheet" href="lib/ann-list.css">
<style>
  /* ── workbench shell (dev chrome — not iOS). Pages section lists workbench pages;
     Example Library loads from previews/library/board.json + sibling screen HTML.
     :root 的 --wb-* token 归 workbench/wb-tokens.css（生成物），此处不再定义。 */
  * { box-sizing:border-box; }
  /* Focus catch-all: low-specificity ring so every focusable control keeps a
     visible focus state; component rules below with their own focus treatment
     (e.g. .wb-page-rename, .wb-time-input) override it by source order. */
  :where(button, a, input, select, textarea, [tabindex]):focus-visible {
    outline:2px solid color-mix(in srgb, var(--wb-accent) 55%, transparent);
    outline-offset:1px;
  }
  body {
    margin:0; height:100vh; overflow:hidden; background:var(--wb-bg); color:var(--wb-fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  }
  .wb { display:flex; height:100vh; }

  /* sidepanel */
  .wb-side {
    width:var(--wb-side-w); flex:none; background:var(--wb-side);
    display:flex; flex-direction:column; min-width:0; overflow:hidden;
    transition: width var(--wb-dur) var(--wb-ease), opacity var(--wb-dur) var(--wb-ease);
  }
  body.wb-resizing .wb-side { transition:none; }
  .wb.wb-side-collapsed .wb-side {
    width:0; opacity:0; pointer-events:none; border:0;
  }
  .wb-splitter {
    flex:none; width:5px; margin:0 -2px; position:relative; z-index:2; cursor:col-resize; touch-action:none;
    background:transparent; border:0; padding:0;
  }
  .wb-splitter::after {
    content:''; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:1px; background:var(--wb-line); transition:width .12s var(--wb-ease), background .12s var(--wb-ease);
  }
  .wb-splitter:hover::after, .wb-splitter.on::after, body.wb-resizing .wb-splitter::after {
    width:3px; background:color-mix(in srgb,var(--wb-accent) 40%,var(--wb-line));
  }
  .wb.wb-side-collapsed .wb-splitter {
    width:14px; margin:0; cursor:pointer;
  }
  .wb.wb-side-collapsed .wb-splitter::after {
    width:2px; background:color-mix(in srgb,var(--wb-accent) 35%,var(--wb-line));
  }
  .wb.wb-side-collapsed .wb-splitter:hover::after {
    width:3px; background:var(--wb-accent);
  }
  body.wb-resizing { cursor:col-resize; user-select:none; }
  body.wb-resizing iframe { pointer-events:none; }

  .wb-head {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px var(--wb-pad) 8px; border-bottom:1px solid var(--wb-line);
  }
  .wb-conn {
    display:inline-flex; align-items:center; gap:6px; min-width:0;
    font-size:11px; font-weight:var(--wb-w-medium); color:var(--wb-muted); line-height:1;
    user-select:none;
  }
  .wb-conn-dot {
    width:7px; height:7px; border-radius:50%; flex:none;
    background:#c7c7cc;
    box-shadow:0 0 0 2px rgba(199,199,204,.25);
  }
  .wb-conn[data-state="online"] { color:#1b7a3d; }
  .wb-conn[data-state="online"] .wb-conn-dot {
    background:#34c759;
    box-shadow:0 0 0 2px rgba(52,199,89,.22);
  }
  .wb-conn[data-state="offline"] { color:var(--wb-danger); }
  .wb-conn[data-state="offline"] .wb-conn-dot {
    background:var(--wb-danger);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--wb-danger) 18%, transparent);
  }
  .wb-conn-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-side-toggle {
    flex:none; width:28px; height:28px; border:0; border-radius:var(--wb-r-2);
    background:transparent; color:var(--wb-faint); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease);
  }
  .wb-side-toggle:hover { color:var(--wb-fg); background:var(--wb-hover); }
  .wb-side-toggle .wb-ico { width:16px; height:16px; display:block; }

  .wb-side-expand {
    display:none; position:absolute; left:10px; top:12px; z-index:8;
    width:32px; height:32px; border:0; border-radius:var(--wb-r-4); cursor:pointer;
    background:rgba(246,246,247,.94); color:var(--wb-muted);
    box-shadow:var(--wb-sh-2), var(--wb-sh-line);
    align-items:center; justify-content:center;
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease);
  }
  .wb-side-expand:hover { color:var(--wb-fg); background:#fff; }
  .wb-side-expand .wb-ico { width:16px; height:16px; display:block; }
  .wb.wb-side-collapsed .wb-side-expand { display:inline-flex; }
  [contenteditable] { cursor:text; border-radius:var(--wb-r-1); transition:background var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease); }
  [contenteditable]:hover { background:color-mix(in srgb,var(--wb-accent) 6%,transparent); }
  [contenteditable]:focus { background:color-mix(in srgb,var(--wb-accent) 8%,transparent); box-shadow:0 0 0 2px color-mix(in srgb,var(--wb-accent) 28%,transparent); }

  /* board mode switch — above pages list */
  .wb-board-mode {
    display:flex; gap:2px; margin:0 var(--wb-pad) 8px; padding:3px;
    border-radius:var(--wb-r-4); background:rgba(0,0,0,.04);
  }
  .wb-board-mode-btn {
    flex:1; border:0; border-radius:var(--wb-r-3); cursor:pointer;
    background:transparent; color:var(--wb-muted);
    font:inherit; font-size:11.5px; font-weight:var(--wb-w-semibold); letter-spacing:.02em;
    padding:6px 8px;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .wb-board-mode-btn:hover { color:var(--wb-fg); }
  .wb-board-mode-btn.on {
    background:#fff; color:var(--wb-fg);
    box-shadow:var(--wb-sh-1);
  }

  /* page list — inspector rows */
  .wb-pages { padding:2px 0 4px; display:flex; flex-direction:column; gap:1px; }
  .wb-page-row {
    display:flex; align-items:stretch; gap:2px; min-width:0;
  }
  .wb-page {
    flex:1; min-width:0; text-align:left; border:0; background:none; color:var(--wb-muted); font:inherit;
    font-size:12.5px; font-weight:var(--wb-w-medium); padding:7px 8px; border-radius:var(--wb-r-2); cursor:pointer;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-page-row:hover .wb-page,
  .wb-page:hover { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-page-row:has(.wb-page.on) .wb-page,
  .wb-page.on {
    background:rgba(0,0,0,.06); color:var(--wb-fg); font-weight:var(--wb-w-semibold);
    box-shadow:inset 2px 0 0 var(--wb-accent);
  }
  .wb-page-copy {
    flex:none; width:28px; border:0; background:none; color:var(--wb-muted); cursor:pointer;
    border-radius:var(--wb-r-2); font-size:12px; line-height:1; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-page-row:hover .wb-page-copy,
  .wb-page-row:focus-within .wb-page-copy,
  .wb-page-copy:focus-visible { opacity:1; }
  .wb-page-copy:hover,
  .wb-page-copy.ok { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-page-copy.ok { color:#1b7a3d; }
  .wb-page.renaming { padding:0; background:rgba(0,0,0,.04); box-shadow:inset 2px 0 0 var(--wb-accent); }
  .wb-page-rename {
    display:block; width:100%; box-sizing:border-box; border:0; outline:none;
    background:transparent; color:var(--wb-fg); font:inherit; font-size:12.5px; font-weight:var(--wb-w-semibold);
    padding:7px 8px; border-radius:var(--wb-r-2);
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--wb-accent) 55%,transparent);
  }

  .wb-side-body { flex:1; min-height:0; display:flex; flex-direction:column; }
  .wb-side-scroll { flex:1; min-height:0; overflow-y:auto; }
  .wb-side-scroll[hidden], .wb-settings-view[hidden], .wb-foot[hidden] { display:none; }
  .wb-settings-view { flex:1; min-height:0; overflow-y:auto; }

  /* collapsible sections — animated open/close */
  .wb-section { border-bottom:1px solid var(--wb-line); }
  .wb-section:last-child { border-bottom:0; }
  .wb-section-head {
    display:flex; align-items:center; gap:7px; width:100%; border:0; background:none; color:var(--wb-faint);
    font:inherit; font-size:10.5px; font-weight:var(--wb-w-semibold); letter-spacing:.04em; text-transform:uppercase;
    padding:11px var(--wb-pad) 9px; cursor:pointer; text-align:left;
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease);
  }
  .wb-section-head:hover { color:var(--wb-muted); background:var(--wb-hover); }
  .wb-section-chevron {
    flex:none; width:6px; height:6px; border-right:1.4px solid currentColor; border-bottom:1.4px solid currentColor;
    transform:rotate(45deg); margin-top:-2px; opacity:.75;
    transition:transform var(--wb-dur) var(--wb-ease), margin-top var(--wb-dur) var(--wb-ease), opacity var(--wb-dur) var(--wb-ease);
  }
  .wb-section.open .wb-section-chevron { transform:rotate(-135deg); margin-top:1px; }
  .wb-section-title { flex:1; min-width:0; }
  .wb-section-count {
    font-size:10px; font-weight:var(--wb-w-semibold); color:var(--wb-faint); font-variant-numeric:tabular-nums;
    letter-spacing:0; text-transform:none;
    transition:opacity var(--wb-dur) var(--wb-ease);
  }
  .wb-section-body {
    display:grid; grid-template-rows:0fr;
    transition:grid-template-rows var(--wb-dur) var(--wb-ease);
  }
  .wb-section.open .wb-section-body { grid-template-rows:1fr; }
  .wb-section-body-inner {
    overflow:hidden; min-height:0;
    padding:0 var(--wb-pad) 12px;
    opacity:0; transform:translateY(-2px);
    pointer-events:none;
    transition:opacity .16s var(--wb-ease), transform .16s var(--wb-ease);
  }
  .wb-section.open .wb-section-body-inner {
    opacity:1; transform:none; pointer-events:auto;
    transition-delay:.04s;
  }

  @media (prefers-reduced-motion: reduce) {
    .wb-side, .wb-section-body, .wb-section-body-inner, .wb-section-chevron,
    .wb-page, .wb-ann-tools button, .wb-ann-item, .wb-gear, #wbtheme.ctl button,
    .wb-ann-filter .ctl button, .wb-section-head, .wb-side-toggle, .wb-side-expand,
    [contenteditable] {
      transition:none !important;
    }
  }

  /* annotator tools — mode segmented (mirrors the injected sidebar's
     交互|标注 control) + compact quick-action grid + quiet destructive row */
  .wb-ann-tools {
    display:flex; flex-direction:column; gap:8px; padding:2px 0 10px;
  }
  .wb-ann-mode {
    display:flex; gap:2px; padding:2px;
    border-radius:var(--wb-r-3); background:rgba(0,0,0,.045);
  }
  .wb-ann-mode button {
    flex:1; border:0; border-radius:var(--wb-r-2); cursor:pointer;
    background:transparent; color:var(--wb-muted);
    font:inherit; font-size:11.5px; font-weight:var(--wb-w-semibold); letter-spacing:.02em;
    padding:6px 8px;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .wb-ann-mode button:hover { color:var(--wb-fg); }
  .wb-ann-mode button.on {
    background:#fff; color:var(--wb-fg);
    box-shadow:var(--wb-sh-1);
  }
  .wb-ann-mode button.on[data-ann-mode="annotate"] {
    background:color-mix(in srgb,#f5a623 16%,#fff); color:#8a5a00;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,#f5a623 35%,transparent);
  }
  .wb-ann-quick {
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px;
  }
  .wb-ann-quick button {
    min-width:0; min-height:44px; border:0; border-radius:var(--wb-r-2); cursor:pointer;
    background:rgba(255,255,255,.7); color:var(--wb-muted);
    font:inherit; font-size:10px; font-weight:var(--wb-w-medium); line-height:1.1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:var(--wb-sh-line);
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .wb-ann-quick button:hover { color:var(--wb-fg); background:#fff; }
  .wb-ann-quick button.on {
    color:var(--wb-fg); background:#fff;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wb-accent) 42%,var(--wb-line));
  }
  .wb-ann-quick button[hidden] { display:none; }
  .wb-ann-quick .wb-tool-label {
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .wb-ann-clear {
    align-self:center; border:0; background:transparent; color:var(--wb-faint);
    font:inherit; font-size:11px; font-weight:var(--wb-w-medium); padding:3px 10px;
    border-radius:var(--wb-r-2); cursor:pointer;
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease);
  }
  .wb-ann-clear:hover { color:var(--wb-danger); background:color-mix(in srgb, var(--wb-danger) 7%, transparent); }
  .wb-ico {
    width:14px; height:14px; flex:none; display:block; aspect-ratio:1;
  }
  .wb-ann-empty-ico {
    width:22px; height:22px; color:var(--wb-faint); opacity:.75; flex:none; display:block;
  }
  .wb-gear-ico {
    width:15px; height:15px; flex:none; display:block; aspect-ratio:1;
  }
  .wb-ann-status {
    display:block; margin:0 0 6px; font-size:10.5px; color:var(--wb-faint); line-height:1.35;
  }
  .wb-ann-status:empty { display:none; }
  .wb-ann-filter { padding:0 0 8px; }
  .wb-ann-filter .ctl {
    width:100%;
    background:rgba(0,0,0,.04);
    border:0;
    padding:2px;
    border-radius:var(--wb-r-2);
  }
  .wb-ann-filter .ctl button {
    font-size:11px; padding:6px 8px; border-radius:var(--wb-r-1);
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .wb-ann-filter .ctl button.on {
    background:#fff; color:var(--wb-fg); font-weight:var(--wb-w-semibold);
    box-shadow:var(--wb-sh-1);
  }
  .wb-ann-list { padding:0 0 2px; }
  /* 行/失效态/空态的共享视觉在 lib/ann-list.css（注入 client 侧边栏内联同一
     份）；这里只保留 workbench 侧的结构增量：item-row 壳、28px 删除钮、
     固定 18px 序号徽标、空态布局与图标。 */
  .wb-ann-empty {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; margin:0;
    border:1px dashed color-mix(in srgb,var(--wb-line) 100%,transparent);
  }
  .wb-ann-empty-title { margin:0; }
  .wb-ann-empty-hint { max-width:16em; }
  .wb-ann-group {
    font-size:10px; font-weight:var(--wb-w-semibold); color:var(--wb-faint); letter-spacing:.04em; text-transform:uppercase;
    padding:10px 2px 4px; line-height:1.2;
  }
  .wb-ann-group:first-child { padding-top:2px; }
  .wb-ann-item { display:flex; flex-direction:column; }
  .wb-ann-item-row { display:flex; gap:2px; align-items:stretch; width:100%; }
  .wb-ann-item--broken .wb-ann-num { box-shadow:var(--wb-sh-line); }
  .wb-ann-broken-tag { display:inline-block; margin-top:1px; }
  .wb-ann-item-main { border-radius:var(--wb-r-2); }
  .wb-ann-del {
    flex:none; align-self:center; width:28px; height:28px; margin-right:4px;
    border:0; border-radius:var(--wb-r-3); background:transparent; color:var(--wb-faint);
    font-size:16px; line-height:1; cursor:pointer; opacity:0;
    transition:opacity var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease);
  }
  .wb-ann-item:hover .wb-ann-del,
  .wb-ann-del:focus-visible { opacity:1; }
  .wb-ann-del:hover { color:var(--wb-danger); background:color-mix(in srgb, var(--wb-danger) 10%, transparent); }
  .wb-ann-num { width:18px; }
  /* footer chrome */
  .wb-foot {
    flex:none; display:flex; gap:6px; margin:0; padding:10px var(--wb-pad);
    border-top:1px solid var(--wb-line); align-items:center;
    background:color-mix(in srgb,var(--wb-side) 88%,#fff);
  }
  #wbtheme.ctl {
    flex:1; min-width:0; gap:2px; padding:2px;
    background:rgba(0,0,0,.045); border-radius:var(--wb-r-2);
  }
  #wbtheme.ctl button {
    flex:1; font-size:11px; font-weight:var(--wb-w-medium); padding:6px 6px; border-radius:var(--wb-r-1);
    color:var(--wb-muted); display:inline-flex; align-items:center; justify-content:center; gap:4px;
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  #wbtheme.ctl button:hover { color:var(--wb-fg); }
  #wbtheme.ctl button.on {
    background:#fff; color:var(--wb-fg); font-weight:var(--wb-w-semibold);
    box-shadow:var(--wb-sh-1);
  }
  #wbtheme .wb-ico { width:12px; height:12px; opacity:.75; transition:opacity var(--wb-dur) var(--wb-ease); }
  #wbtheme button.on .wb-ico { opacity:1; }

  .wb-gear {
    flex:none; width:28px; height:28px; border:0; background:transparent;
    color:var(--wb-muted); padding:0; border-radius:var(--wb-r-2);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    box-shadow:var(--wb-sh-line);
    transition:color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .wb-gear:hover { color:var(--wb-fg); background:rgba(255,255,255,.8); }
  .wb-gear.on {
    color:var(--wb-accent); background:color-mix(in srgb,var(--wb-accent) 8%,#fff);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wb-accent) 30%,transparent);
  }

  .wb-settings-head {
    position:relative; display:flex; align-items:center; min-height:44px;
    padding:0 var(--wb-pad); border-bottom:1px solid var(--wb-line);
  }
  .wb-back {
    position:relative; z-index:1; border:0; background:none; color:var(--wb-accent);
    font:inherit; font-size:14px; font-weight:var(--wb-w-regular); padding:0; cursor:pointer;
    display:inline-flex; align-items:center; gap:2px; line-height:1;
  }
  .wb-settings-title {
    position:absolute; left:50%; transform:translateX(-50%);
    margin:0; font-size:14px; font-weight:var(--wb-w-semibold); letter-spacing:-.01em;
    pointer-events:none; white-space:nowrap;
  }

  /* settings page controls */
  .wb-ctrls { padding:14px var(--wb-pad) 18px; display:flex; flex-direction:column; gap:10px; }
  .ctl-row { display:flex; align-items:center; gap:10px; }
  .ctl-row > span { font-size:11px; font-weight:var(--wb-w-semibold); color:var(--wb-muted); width:42px; flex:none; }
  .ctl {
    display:inline-flex; gap:2px; background:var(--wb-fill); border-radius:var(--wb-r-2); padding:2px; flex:1;
  }
  .ctl button {
    flex:1; border:0; background:none; color:var(--wb-muted); font:inherit;
    font-size:11.5px; font-weight:var(--wb-w-medium); padding:6px 6px; border-radius:var(--wb-r-1); cursor:pointer; white-space:nowrap;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease), box-shadow var(--wb-dur) var(--wb-ease);
  }
  .ctl button:hover { color:var(--wb-fg); }
  .ctl button.on {
    background:#fff; color:var(--wb-fg); font-weight:var(--wb-w-semibold);
    box-shadow:var(--wb-sh-1);
  }
  .wb-time-input {
    flex:1; border:0; background:rgba(255,255,255,.75); color:inherit;
    font:inherit; font-size:13px; font-weight:var(--wb-w-semibold); padding:7px 10px; border-radius:var(--wb-r-2);
    font-variant-numeric:tabular-nums; box-shadow:var(--wb-sh-line);
  }
  .wb-time-input:focus { outline:2px solid color-mix(in srgb,var(--wb-accent) 35%,transparent); }
  .wb-clock-fixed[hidden] { display:none; }

  .wb-font-section { padding: 2px 0 4px; }
  .wb-font-section > span { display:block; font-size:11px; font-weight:var(--wb-w-semibold); color:var(--wb-muted); margin-bottom:8px; }
  .wb-font-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .wb-font-opt {
    border:1px solid var(--wb-line); border-radius:var(--wb-r-2); background:rgba(255,255,255,.55);
    padding:10px 8px 8px; cursor:pointer; color:inherit; font:inherit; text-align:center;

  }
  .wb-font-opt:hover { background:#fff; }
  .wb-font-opt.on { border-color:color-mix(in srgb,var(--wb-accent) 45%,transparent); background:color-mix(in srgb,var(--wb-accent) 7%,#fff); }
  .wb-font-sample { display:block; font-size:21px; line-height:1.1; margin-bottom:6px; }
  .wb-font-cap { display:block; font-size:10px; font-weight:var(--wb-w-semibold); color:var(--wb-faint); letter-spacing:0; text-indent:0; }

  .wb-stage-wrap {
    flex:1; min-width:0; position:relative; display:flex; min-height:0;
  }
  /* main stage — canvas has intrinsic size; #wbstage is only a scrollport */
  .wb-stage {

    cursor:default;
  }
  .wb-stage.wb-space-pan { cursor:grab; }
  .wb-stage.wb-panning, body.wb-panning .wb-stage, body.wb-panning .wb-stage * { cursor:grabbing !important; }
  body.wb-panning { user-select:none; }

  .wb-canvas-hud {
    position:absolute; right:14px; bottom:14px; z-index:7;
    display:flex; align-items:center; gap:6px;
    padding:4px; border-radius:var(--wb-r-4);
    background:rgba(246,246,247,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:var(--wb-sh-2), var(--wb-sh-line);
    font-size:12px; color:var(--wb-fg);
  }
  .wb-canvas-dock {
    --wb-canvas-nav-w:232px;
    position:absolute; right:14px; bottom:58px; z-index:7;
    max-height:calc(100% - 72px);
    display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    pointer-events:none;
  }
  .wb-canvas-dock > * { pointer-events:auto; }
  .wb-minimap-wrap {
    position:relative; display:flex; align-items:center;
  }
  .wb-minimap-wrap[hidden] { display:none; }
  .wb-minimap-toggle {
    width:30px; min-width:30px; padding:0;
  }
  .wb-toolbar-tool-btn.on { color:var(--wb-accent); background:#fff; }
  .wb-toolbar-divider { width:1px; height:20px; background:var(--wb-line); flex:none; }
  .wb-minimap {
    position:relative;
    width:var(--wb-canvas-nav-w); padding:6px; box-sizing:border-box;
    border-radius:var(--wb-r-4); cursor:crosshair;
    background:rgba(246,246,247,.97); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:var(--wb-sh-3), var(--wb-sh-line);
  }
  .wb-minimap[hidden] { display:none; }
  .wb-minimap-head {
    height:24px; padding:0 4px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:10.5px; font-weight:var(--wb-w-bold); color:var(--wb-fg);
  }
  .wb-minimap-levels { color:var(--wb-faint); font-weight:var(--wb-w-semibold); }
  .wb-minimap canvas {
    display:block; width:calc(var(--wb-canvas-nav-w) - 12px); height:132px; border-radius:var(--wb-r-2);
    background:color-mix(in srgb, var(--wb-stage-bg) 88%, #fff);
  }
  .wb-section-nav-wrap {
    position:relative; display:flex; align-items:center;
  }
  .wb-section-nav-wrap[hidden] { display:none; }
  .wb-section-nav-toggle {
    min-width:54px; padding:0 8px; gap:5px;
  }
  .wb-section-nav-toggle:hover,
  .wb-section-nav-toggle.on { color:var(--wb-accent); background:#fff; }
  .wb-section-nav-position { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .wb-section-nav {
    position:relative;
    width:var(--wb-canvas-nav-w); max-height:min(320px, calc(100vh - 92px)); box-sizing:border-box;
    padding:8px; border-radius:var(--wb-r-4); overflow:hidden;
    background:rgba(246,246,247,.97); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:var(--wb-sh-3), var(--wb-sh-line);
  }
  .wb-section-nav[hidden] { display:none; }
  .wb-section-nav-head {
    height:28px; padding:0 7px 5px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:11px; font-weight:var(--wb-w-bold); color:var(--wb-fg);
  }
  .wb-section-nav-status { color:var(--wb-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .wb-section-nav-list {
    max-height:min(272px, calc(100vh - 140px)); overflow:auto;
    display:flex; flex-direction:column; gap:3px;
  }
  .wb-section-nav-item {
    position:relative; min-height:38px; padding:4px 7px 4px 9px; box-sizing:border-box;
    border-radius:var(--wb-r-3); display:grid; grid-template-columns:minmax(0, 1fr) auto; align-items:center; gap:8px;
    color:var(--wb-muted);
  }
  .wb-section-nav-item::before {
    content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:var(--wb-r-1);
    background:transparent;
  }
  .wb-section-nav-item.on { background:color-mix(in srgb,var(--wb-accent) 8%,#fff); }
  .wb-section-nav-item.on::before { background:var(--wb-accent); }
  .wb-section-nav-section {
    min-width:0; height:30px; padding:0; border:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; text-align:left;
    color:inherit; font:inherit; font-size:12px; font-weight:var(--wb-w-semibold);
  }
  .wb-section-nav-item.on .wb-section-nav-section { color:var(--wb-fg); }
  .wb-section-nav-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wb-section-nav-screens { display:flex; align-items:center; gap:4px; }
  .wb-section-nav-screen {
    width:14px; height:26px; padding:0; border:1px solid color-mix(in srgb,var(--wb-muted) 34%,transparent);
    border-radius:var(--wb-r-1); background:rgba(255,255,255,.72); cursor:pointer;
    transition:border-color var(--wb-dur) var(--wb-ease), background var(--wb-dur) var(--wb-ease), transform var(--wb-dur) var(--wb-ease);
  }
  .wb-section-nav-screen:hover,
  .wb-section-nav-screen:focus-visible {
    border-color:var(--wb-accent); background:#fff; transform:translateY(-1px);
  }
  .wb-hud-group {
    display:flex; align-items:center; gap:1px;
    background:rgba(0,0,0,.04); border-radius:var(--wb-r-2); padding:2px;
  }
  .wb-hud-btn {
    border:0; background:transparent; color:var(--wb-muted); font:inherit;
    font-size:13px; font-weight:var(--wb-w-semibold); line-height:1;
    min-width:28px; height:28px; padding:0 8px; border-radius:var(--wb-r-2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-hud-btn:hover { background:#fff; color:var(--wb-fg); }
  .wb-hud-zoom {
    min-width:52px; font-variant-numeric:tabular-nums; font-weight:var(--wb-w-semibold); font-size:12px;
    color:var(--wb-fg); letter-spacing:-.01em;
  }
  .wb-hud-recenter {
    font-size:11.5px; font-weight:var(--wb-w-semibold); padding:0 10px; min-width:auto;
  }
  /* Huge empty margin around the board so the viewer can pan freely */
  .wb-panel {
    --wb-board-pad: 3200px;
    display:block; width:max-content; min-width:100%;
    box-sizing:border-box; overflow:visible;
    padding: var(--wb-board-pad);
  }
  /* Scale via transform (not CSS zoom): zoom breaks elementFromPoint vs getBoundingClientRect. */
  .wb-zoom-wrap {
    position: relative;
    overflow: hidden;
    width: max-content;
    height: auto;
  }
  .wb-library {
    /* Board tokens: captions scale with phone frame so agents only write copy. */
    --wb-phone-w: 438px;
    --wb-phone-h: 910px;
    --wb-cap-section: calc(var(--wb-phone-w) * 0.073); /* ~32px @ 438 */
    --wb-cap-screen: calc(var(--wb-phone-w) * 0.055);  /* ~24px @ 438 — step label, not footnote */
    --wb-cap-note: calc(var(--wb-phone-w) * 0.032);    /* ~14px @ 438 */
    --wb-cap-gap: calc(var(--wb-phone-w) * 0.032);     /* ~14px */
    display:flex; flex-direction:column; gap:56px;
    padding:32px 24px 80px; box-sizing:border-box;
    width:max-content; min-width:0;
    align-items:flex-start;
    transform: scale(var(--wb-board-zoom, 1));
    transform-origin: 0 0;
  }
  .wb-lib-item {
    width:max-content; max-width:none;
    display:flex; flex-direction:column; align-items:flex-start; gap:var(--wb-cap-gap);
    scroll-margin-top:24px; flex:none;
  }
  .wb-lib-cap {
    flex:none; width:var(--wb-phone-w); max-width:none; margin:0;
    font-size:var(--wb-cap-section); font-weight:var(--wb-w-semibold); line-height:1.2; letter-spacing:-.02em;
    color:var(--wb-fg);
  }
  .wb-sec-body {
    width:max-content; display:flex; align-items:flex-start; justify-content:flex-start;
    flex:none;
  }
  .wb-sec-column { flex-direction:column; align-items:flex-start; gap:24px; flex-wrap:nowrap; }
  /* Row: titles, phones, and durable Frame Notes each share a row. */
  .wb-sec-row {
    display:grid;
    grid-auto-flow:column;
    grid-template-rows:auto auto auto;
    column-gap:28px;
    row-gap:var(--wb-cap-gap);
    align-items:start;
  }
  .wb-sec-row .wb-screen { display:contents; }
  /* Phone frame on the board = iPhone 16 Pro chrome (402+2×18), not a fluid fit box */
  .wb-screen {
    width:var(--wb-phone-w); max-width:none; flex:none;
    display:flex; flex-direction:column; gap:var(--wb-cap-gap);
  }
  .wb-lib-item .ios-stage {
    width:var(--wb-phone-w); height:var(--wb-phone-h);
    max-width:none; min-height:0; padding:0;
    flex:none;
  }
  .wb-screen .ios-stage { flex:none; min-height:0; width:var(--wb-phone-w); height:var(--wb-phone-h); }
  .wb-screen-cap {
    flex:none; width:var(--wb-phone-w); box-sizing:border-box;
    text-align:left;
    font-size:var(--wb-cap-screen); font-weight:var(--wb-w-semibold); line-height:1.3; letter-spacing:-.015em;
    color:var(--wb-fg);
    opacity:.72;
  }
  .wb-sec-column .wb-screen-cap--empty { display:none; }
  .wb-frame-note {
    position:relative;
    width:var(--wb-phone-w); box-sizing:border-box;
    padding:12px 14px;
    border:1px solid color-mix(in srgb, var(--wb-line) 72%, transparent);
    border-radius:var(--wb-r-4);
    background:color-mix(in srgb, var(--wb-side) 78%, transparent);
    color:var(--wb-muted);
    font-size:var(--wb-cap-note); line-height:1.55;
  }
  .wb-frame-note.is-empty {
    padding:0;
    border:0;
    background:transparent;
  }
  .wb-frame-note.is-empty.is-editing {
    padding:12px 14px;
    border:1px dashed color-mix(in srgb, var(--wb-line) 72%, transparent);
    background:color-mix(in srgb, var(--wb-side) 78%, transparent);
  }
  .wb-frame-note-view { display:flex; align-items:flex-start; gap:10px; }
  .wb-frame-note.is-empty .wb-frame-note-view { justify-content:flex-end; }
  .wb-frame-note.is-empty .wb-frame-note-placeholder { display:none; }
  .wb-frame-note-text {
    flex:1; min-width:0;
    color:var(--wb-fg); opacity:.68;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .wb-frame-note-placeholder { color:var(--wb-faint); }
  .wb-frame-note-edit,
  .wb-frame-note-action {
    appearance:none; flex:none;
    border:0; border-radius:var(--wb-r-3);
    padding:5px 8px;
    background:transparent; color:var(--wb-faint);
    font:inherit; font-weight:var(--wb-w-semibold); line-height:1.2;
    cursor:pointer;
  }
  .wb-frame-note-edit:hover,
  .wb-frame-note-action:hover { background:var(--wb-hover); color:var(--wb-fg); }
  .wb-frame-note.is-empty .wb-frame-note-edit {
    border:1px dashed var(--wb-line);
    color:var(--wb-faint);
  }
  .wb-frame-note-editor { display:flex; flex-direction:column; gap:9px; }
  .wb-frame-note-editor[hidden],
  .wb-frame-note-view[hidden] { display:none; }
  .wb-frame-note-input {
    width:100%; min-height:164px; resize:vertical; box-sizing:border-box;
    border:1px solid var(--wb-line); border-radius:var(--wb-r-4);
    padding:10px 11px;
    background:var(--wb-side); color:var(--wb-fg);
    font:inherit; line-height:1.55;
    outline:none;
  }
  .wb-frame-note-input:focus { border-color:var(--wb-accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--wb-accent) 14%, transparent); }
  .wb-frame-note-footer { display:flex; align-items:center; gap:6px; }
  .wb-frame-note-status { flex:1; min-width:0; color:var(--wb-faint); font-size:.9em; }
  .wb-frame-note-status.is-error { color:var(--wb-danger); }
  .wb-frame-note-action[data-frame-note-action="save"] { background:var(--wb-accent); color:#fff; }
  .wb-frame-note-action:disabled { cursor:default; opacity:.45; }
  /* Component Library: light board, no phone chrome */
  .wb-screen--comp {
    --wb-phone-w: auto;
    --wb-phone-h: auto;
    width:max-content; min-width:280px; max-width:420px;
  }
  .wb-comp-stage {
    width:max-content; min-width:280px; max-width:420px;
    box-sizing:border-box;
    padding:20px 18px 24px;
    border-radius:var(--wb-r-board);
    background:#fff;
    box-shadow:var(--wb-sh-board);
  }
  /* Web board: desktop / report artboards */
  .wb-screen--web {
    --wb-phone-w: var(--wb-web-w, 960px);
    --wb-phone-h: auto;
    width:var(--wb-web-w, 960px);
  }
  .wb-html-stage {
    width:var(--wb-web-w, 960px);
    box-sizing:border-box;
    border-radius:var(--wb-r-board);
    background:#fff;
    box-shadow:var(--wb-sh-board);
    overflow:hidden;
  }
  .wb-html-surface {
    position:relative;
    width:100%;
    min-height:540px;
    overflow:auto;
    background:#fff;
    color:#171717;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC",serif;
  }
  /* HTML board: standalone-document artboard. Wider than Web so report pages
     that switch layout at a desktop breakpoint (side nav, two-column) show the
     desktop form; tall so long documents read without an inner scrollbar. */
  .wb-screen--doc {
    --wb-phone-w: var(--wb-doc-w, 1280px);
    --wb-phone-h: auto;
    width:var(--wb-doc-w, 1280px);
  }
  .wb-doc-stage {
    width:var(--wb-doc-w, 1280px);
    box-sizing:border-box;
    border-radius:var(--wb-r-board);
    background:#fff;
    box-shadow:var(--wb-sh-board);
    overflow:hidden;
  }
  .wb-doc-surface { position:relative; width:100%; background:#fff; }
  .wb-doc-frame { display:block; width:100%; height:100%; border:0; background:#fff; }

  /* HTML board is NOT a canvas. A report has to be read at the reader's real
     window size, so the document fills the stage 1:1 — no zoom, no pan, no
     artboard. Versions switch from the sidebar instead of sitting side by side.
     The chain stage → panel → zoom-wrap → library → item → sec-body → screen →
     doc-stage must each carry a definite height, or the iframe's height:100%
     resolves against auto and collapses. */
  [data-board-mode="html"] .wb-stage { overflow:hidden; padding:0; }
  [data-board-mode="html"] .wb-canvas-hud,
  [data-board-mode="html"] .wb-canvas-dock { display:none; }
  [data-board-mode="html"] #wb-board-panel { width:100%; height:100%; padding:0; }
  [data-board-mode="html"] .wb-zoom-wrap {
    width:100%; height:100%; transform:none !important;
  }
  [data-board-mode="html"] .wb-library {
    display:block; width:100%; height:100%; padding:0; gap:0; transform:none !important;
  }
  [data-board-mode="html"] .wb-lib-item {
    display:flex; flex-direction:column; width:100%; height:100%; margin:0; padding:0; gap:0;
    border:0; background:transparent; box-shadow:none;
  }
  /* section 标题、frame 标题、Frame Note、画布导出入口都属于画布语汇，
     整页阅读时不要。汇报页出图走侧栏「导出文档」（真实版面长图 / HTML）。 */
  [data-board-mode="html"] .wb-lib-cap,
  [data-board-mode="html"] .wb-screen-cap,
  [data-board-mode="html"] .wb-export-trigger,
  [data-board-mode="html"] .wb-frame-note { display:none; }
  [data-board-mode="html"] .wb-sec-body {
    display:flex; flex:1; min-height:0; width:100%; padding:0; gap:0;
  }
  [data-board-mode="html"] .wb-screen--doc {
    flex:1; min-width:0; min-height:0; width:100%; height:auto; margin:0;
  }
  [data-board-mode="html"] .wb-doc-stage {
    width:100%; height:100%; border-radius:0; box-shadow:none;
  }
  [data-board-mode="html"] .wb-doc-surface { height:100%; }
  /* one document at a time; the sidebar picks which */
  [data-board-mode="html"] .wb-lib-item[data-doc-hidden],
  [data-board-mode="html"] .wb-screen[data-doc-hidden] { display:none; }

  /* sidebar version switcher (HTML board only) */
  .wb-doc-versions { display:flex; flex-direction:column; gap:1px; padding:2px 0 4px; }
  /* display 会盖掉 [hidden] 的 UA 规则，必须显式还回来，否则切回 iOS/Web 板还留着 */
  .wb-doc-versions[hidden] { display:none; }
  .wb-doc-versions .wb-doc-ver-head {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:10px; font-weight:var(--wb-w-bold); letter-spacing:.06em; text-transform:uppercase;
    color:var(--wb-faint); padding:8px var(--wb-pad) 4px;
  }
  .wb-doc-export {
    appearance:none; border:1px solid var(--wb-line); border-radius:var(--wb-r-2);
    background:var(--wb-side); color:var(--wb-muted); cursor:pointer;
    font:inherit; font-size:11px; font-weight:var(--wb-w-semibold); letter-spacing:0; text-transform:none;
    padding:3px 8px; line-height:1.2;
  }
  .wb-doc-export:hover, .wb-doc-export:focus-visible {
    color:var(--wb-accent); border-color:color-mix(in srgb, var(--wb-accent) 40%, var(--wb-line));
  }
  .wb-export-options.wb-export-options--stack {
    grid-auto-flow:row; grid-auto-columns:unset; grid-template-columns:1fr;
  }
  .wb-export-options.wb-export-options--stack .wb-export-option span {
    justify-content:flex-start; min-height:40px; padding:8px 12px; gap:8px;
  }
  .wb-export-option-copy { display:flex; flex-direction:column; gap:1px; text-align:left; }
  .wb-export-option-copy strong { font-size:12.5px; font-weight:var(--wb-w-semibold); color:inherit; }
  .wb-export-option-copy small { font-size:11px; font-weight:var(--wb-w-medium); color:var(--wb-faint); }
  .wb-doc-ver {
    border:0; background:transparent; text-align:left; cursor:pointer;
    font:inherit; font-size:12.5px; color:var(--wb-muted);
    padding:6px var(--wb-pad); border-radius:var(--wb-r-2); margin:0 6px;
    transition:background var(--wb-dur) var(--wb-ease), color var(--wb-dur) var(--wb-ease);
  }
  .wb-doc-ver:hover { background:rgba(0,0,0,.04); color:var(--wb-fg); }
  .wb-doc-ver.on { background:rgba(0,0,0,.06); color:var(--wb-fg); font-weight:var(--wb-w-semibold); }
  .wb-doc-ver-sec {
    font-size:10px; color:var(--wb-faint); padding:6px var(--wb-pad) 2px; letter-spacing:.04em;
  }
  .wb-comp-stage .ios-root {
    display:block; width:100%; min-width:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  }
  .wb-comp-stage .ios-app {
    position:relative; inset:auto; overflow:visible;
    background:transparent; min-height:0;
  }
  .wb-comp-stage .ios-page { padding-bottom:8px; }
  .wb-comp-stage .ios-nav,
  .wb-comp-stage .ios-navbar { position:relative; }
  .wb-screen-err {
    margin:24px auto; padding:16px 18px; max-width:420px; text-align:center;
    font-size:12px; line-height:1.45; color:var(--wb-muted);
    border:1px dashed var(--wb-line); border-radius:var(--wb-r-2); background:rgba(255,255,255,.5);
  }
  /* Export is a Workbench concern: controls never enter the isolated export surface. */
  .wb-lib-item { position:relative; }
  .wb-export-trigger {
    appearance:none; position:absolute; z-index:18;
    width:32px; height:32px; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid color-mix(in srgb, var(--wb-line) 84%, transparent);
    border-radius:var(--wb-r-4); background:color-mix(in srgb, var(--wb-side) 88%, transparent);
    color:var(--wb-muted); box-shadow:var(--wb-sh-2);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    cursor:pointer; opacity:.72; transform:none;
    transition:opacity var(--wb-dur) var(--wb-ease),transform var(--wb-dur) var(--wb-ease),color var(--wb-dur) var(--wb-ease);
  }
  .wb-export-trigger:hover,.wb-export-trigger:focus-visible { color:var(--wb-accent); }
  .wb-export-section-trigger { top:2px; left:calc(var(--wb-phone-w) + 10px); }
  .wb-export-trigger:focus-visible,
  .wb-lib-item:hover>.wb-export-section-trigger { opacity:1; transform:none; }
  .wb-screen-cap.has-frame-menu {
    position:relative; z-index:30;
    padding-right:40px; min-height:30px;
  }
  .wb-sec-column .wb-screen-cap--empty.has-frame-menu { display:block; }
  .wb-frame-menu-shell { position:absolute; z-index:42; top:0; right:0; width:30px; height:30px; }
  .wb-frame-menu-trigger {
    appearance:none; width:30px; height:30px; padding:0; border:1px solid transparent;
    border-radius:var(--wb-r-3); display:inline-flex; align-items:center; justify-content:center;
    background:color-mix(in srgb,var(--wb-side) 72%,transparent); color:var(--wb-muted); font:inherit; font-size:18px; font-weight:var(--wb-w-bold);
    line-height:1; cursor:pointer; opacity:.82; border-color:color-mix(in srgb,var(--wb-line) 72%,transparent);
  }
  .wb-frame-menu-trigger:hover,.wb-frame-menu-trigger:focus-visible,.wb-frame-menu-trigger[aria-expanded="true"] {
    opacity:1; color:var(--wb-fg); background:var(--wb-hover); border-color:var(--wb-line);
  }
  .wb-frame-menu {
    position:absolute; z-index:50; top:35px; right:0; width:204px; box-sizing:border-box;
    padding:5px; border:1px solid color-mix(in srgb,var(--wb-line) 90%,transparent);
    border-radius:var(--wb-r-4); background:var(--wb-side);
    box-shadow:var(--wb-sh-3);
  }
  /* Radix DropdownMenu 的 popper 包装层置惰（P3）：菜单几何由 .wb-frame-menu 的
     绝对定位拥有 —— .wb-library 是 transform:scale 空间，JS 量测定位在缩放 ≠1
     时必错位；!important 压过 Radix 写在内联 style 里的 position/transform。 */
  [data-radix-popper-content-wrapper] { position:static !important; transform:none !important; min-width:0 !important; }
  .wb-frame-menu-item {
    appearance:none; width:100%; min-height:34px; padding:0 9px; border:0; border-radius:var(--wb-r-3);
    display:flex; align-items:center; gap:9px; background:transparent; color:var(--wb-fg);
    font:inherit; font-size:12px; font-weight:var(--wb-w-semibold); text-align:left; cursor:pointer;

  .wb-frame-menu-item svg { color:var(--wb-muted); }
  .wb-export-dialog {

    background:var(--wb-side); color:var(--wb-fg);

  }
  .wb-export-dialog::backdrop { background:rgba(22,22,24,.3); backdrop-filter:blur(3px); }
  .wb-export-form { padding:20px; display:flex; flex-direction:column; gap:17px; }
  .wb-export-head { display:flex; align-items:flex-start; gap:12px; }
  .wb-export-head-copy { flex:1; min-width:0; }
  .wb-export-head h2 { margin:0; font-size:18px; line-height:1.25; letter-spacing:-.015em; }
  .wb-export-target { margin:5px 0 0; color:var(--wb-faint); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wb-export-close { border:0; background:transparent; color:var(--wb-faint); font-size:22px; line-height:1; padding:0 2px; cursor:pointer; }
  .wb-export-field { display:flex; flex-direction:column; gap:7px; }
  .wb-export-label { color:var(--wb-muted); font-size:12px; font-weight:var(--wb-w-semibold); }
  .wb-export-check {
    display:flex; align-items:flex-start; gap:8px; padding:8px 10px;
    border-radius:var(--wb-r-4); background:var(--wb-hover); cursor:pointer;
    font-size:12.5px; font-weight:var(--wb-w-medium); color:var(--wb-fg);
  }
  .wb-export-check input { margin-top:2px; flex:none; }
  .wb-export-check span { line-height:1.4; }
  .wb-export-options { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; padding:3px; border-radius:var(--wb-r-4); background:var(--wb-hover); }
  .wb-export-option { position:relative; }
  .wb-export-option input { position:absolute; opacity:0; pointer-events:none; }
  .wb-export-option span { display:flex; align-items:center; justify-content:center; min-height:32px; padding:0 9px; border-radius:var(--wb-r-3); color:var(--wb-muted); font-size:12px; font-weight:var(--wb-w-semibold); cursor:pointer; }
  .wb-export-option input:checked+span { background:var(--wb-side); color:var(--wb-fg); box-shadow:var(--wb-sh-1); }
  .wb-export-note-toggle { display:flex; align-items:flex-start; gap:9px; color:var(--wb-muted); font-size:13px; line-height:1.4; }
  .wb-export-note-toggle input { margin-top:2px; accent-color:var(--wb-accent); }
  .wb-export-status { min-height:17px; color:var(--wb-faint); font-size:12px; }
  .wb-export-status.is-error { color:var(--wb-danger); }
  .wb-export-tokens {
    display:flex; flex-wrap:wrap; gap:8px; margin-top:-4px;
  }
  .wb-export-tokens[hidden] { display:none; }
  .wb-export-token {
    display:inline-flex; align-items:baseline; gap:5px;
    min-height:26px; padding:3px 9px; border-radius:999px;
    border:1px solid var(--wb-line); background:var(--wb-hover);

  }
  .wb-export-token-label { color:var(--wb-faint); font-weight:var(--wb-w-semibold); }
  .wb-export-token-n { color:var(--wb-fg); font-variant-numeric:tabular-nums; font-weight:var(--wb-w-bold); }
  .wb-export-token-pending { color:var(--wb-faint); font-size:12px; }
  .wb-export-actions { display:flex; justify-content:flex-end; gap:8px; }
  .wb-export-action { min-height:38px; padding:0 15px; border:1px solid var(--wb-line); border-radius:var(--wb-r-4); background:var(--wb-side); color:var(--wb-fg); font:inherit; font-size:13px; font-weight:var(--wb-w-semibold); cursor:pointer; }
  .wb-export-action.primary { border-color:var(--wb-accent); background:var(--wb-accent); color:#fff; }
  .wb-export-action:disabled { cursor:wait; opacity:.55; }
</style>
</head>
